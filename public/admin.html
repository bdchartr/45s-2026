<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>45 Admin Console</title>
  <style>
    :root {
      --bg: #f4f1e8;
      --panel: #fffdf8;
      --ink: #1f2328;
      --accent: #0f766e;
      --danger: #b91c1c;
      --line: #d7d2c8;
    }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: linear-gradient(180deg, #efe9db 0%, var(--bg) 100%); color: var(--ink); }
    .wrap { max-width: 1080px; margin: 24px auto; padding: 0 16px 40px; }
    h1 { margin: 0 0 16px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    label { display: block; font-size: 13px; margin-top: 8px; }
    input, select, button, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; border-radius: 6px; border: 1px solid #bdb6aa; }
    button { background: var(--accent); border: none; color: white; font-weight: 600; cursor: pointer; margin-top: 10px; }
    button.secondary { background: #475569; }
    pre { background: #111827; color: #e5e7eb; padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hint { font-size: 12px; color: #4b5563; }
    .error { color: var(--danger); font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>45 Admin Console</h1>
    <div class="hint">Owners/Admins can list users/games, create users, and change roles. Authorization now uses the active session.</div>

    <div class="grid">
      <section class="card">
        <h3>Auth Context</h3>
        <label>username<input id="loginUsername" value="chartb"></label>
        <label>password<input id="loginPassword" type="password" value=""></label>
        <button onclick="loginLocal()">Login (username/password)</button>
        <label>google id_token<input id="googleToken" value=""></label>
        <button class="secondary" onclick="loginGoogle()">Login (Google SSO)</button>
        <button class="secondary" onclick="logoutUser()">Logout</button>
        <button class="secondary" onclick="whoAmI()">Who Am I</button>
        <button onclick="refreshAll()">Refresh Users + Games + Stats</button>
      </section>

      <section class="card">
        <h3>Create User</h3>
        <label>username<input id="newUsername" value="player_new"></label>
        <label>email<input id="newEmail" value="player_new@45s.local"></label>
        <div class="row">
          <label>role
            <select id="newRole"><option>player</option><option>admin</option><option>owner</option></select>
          </label>
          <label>auth_provider
            <select id="newAuthProvider" onchange="toggleAuthFields()"><option>local</option><option>google</option><option>sso</option></select>
          </label>
        </div>
        <label id="passwordWrap">password<input id="newPassword" type="text" value="ChangeMe123!"></label>
        <label id="externalWrap" class="hidden">external_sub<input id="newExternalSub" value=""></label>
        <button onclick="createUser()">Create User</button>
      </section>

      <section class="card">
        <h3>Update Role</h3>
        <div class="row">
          <label>user_id<input id="roleUserId" type="number" min="1" value="2"></label>
          <label>new role
            <select id="roleValue"><option>player</option><option>admin</option><option>owner</option></select>
          </label>
        </div>
        <button onclick="updateRole()">Update Role</button>
      </section>

      <section class="card">
        <h3>Stats Summary</h3>
        <pre id="statsOut">{}</pre>
      </section>

      <section class="card">
        <h3>Users</h3>
        <pre id="usersOut">[]</pre>
      </section>

      <section class="card">
        <h3>Games</h3>
        <pre id="gamesOut">[]</pre>
      </section>
    </div>

    <p id="status" class="hint"></p>
  </div>

  <script>
    const byId = (id) => document.getElementById(id);
    let csrfToken = '';

    async function api(path, method = 'GET', body = null, options = {}) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      if (options.withCsrf && csrfToken) {
        opts.headers['X-CSRF-Token'] = csrfToken;
      }
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(JSON.stringify(data));
      return data;
    }

    async function refreshCsrf() {
      try {
        const me = await api('/45/api/auth/me');
        if (me && me.csrf_token) {
          csrfToken = me.csrf_token;
          return;
        }
      } catch (_) {
        // Ignore and attempt fallback endpoint.
      }

      try {
        const tokenData = await api('/45/api/auth/csrf');
        csrfToken = (tokenData && tokenData.csrf_token) ? tokenData.csrf_token : '';
      } catch (_) {
        csrfToken = '';
      }
    }

    function setStatus(msg, isError = false) {
      const el = byId('status');
      el.textContent = msg;
      el.className = isError ? 'error' : 'hint';
    }

    function toggleAuthFields() {
      const provider = byId('newAuthProvider').value;
      byId('passwordWrap').style.display = provider === 'local' ? 'block' : 'none';
      byId('externalWrap').style.display = provider === 'local' ? 'none' : 'block';
    }

    async function whoAmI() {
      try {
        const data = await api('/45/api/auth/me');
        csrfToken = data.csrf_token || csrfToken;
        setStatus('Auth state: ' + JSON.stringify(data));
      } catch (err) {
        setStatus('Who am I failed: ' + err.message, true);
      }
    }

    async function loginLocal() {
      try {
        const data = await api('/45/api/auth/login', 'POST', {
          username: byId('loginUsername').value.trim(),
          password: byId('loginPassword').value,
        });
        csrfToken = data.csrf_token || csrfToken;
        await refreshCsrf();
        setStatus('Logged in as ' + data.username + ' (' + data.role + ')');
      } catch (err) {
        setStatus('Login failed: ' + err.message, true);
      }
    }

    async function loginGoogle() {
      try {
        const data = await api('/45/api/auth/google/login', 'POST', {
          id_token: byId('googleToken').value.trim(),
        });
        csrfToken = data.csrf_token || csrfToken;
        await refreshCsrf();
        setStatus('Google login ok: ' + data.username + ' (' + data.role + ')');
      } catch (err) {
        setStatus('Google login failed: ' + err.message, true);
      }
    }

    async function logoutUser() {
      try {
        await api('/45/api/auth/logout', 'POST', {}, { withCsrf: true });
        await refreshCsrf();
        setStatus('Logged out.');
      } catch (err) {
        setStatus('Logout failed: ' + err.message, true);
      }
    }

    async function refreshAll() {
      try {
        const [users, games, stats] = await Promise.all([
          api('/45/api/admin/users'),
          api('/45/api/admin/games'),
          api('/45/api/stats/summary'),
        ]);
        byId('usersOut').textContent = JSON.stringify(users.users, null, 2);
        byId('gamesOut').textContent = JSON.stringify(games.games, null, 2);
        byId('statsOut').textContent = JSON.stringify(stats, null, 2);
        setStatus('Refreshed successfully.');
      } catch (err) {
        setStatus('Refresh failed: ' + err.message, true);
      }
    }

    async function createUser() {
      try {
        const payload = {
          username: byId('newUsername').value.trim(),
          email: byId('newEmail').value.trim(),
          role: byId('newRole').value,
          auth_provider: byId('newAuthProvider').value,
        };
        if (payload.auth_provider === 'local') {
          payload.password = byId('newPassword').value;
        } else {
          payload.external_sub = byId('newExternalSub').value.trim();
        }
        const data = await api('/45/api/admin/users/create', 'POST', payload, { withCsrf: true });
        setStatus('User created: id=' + data.user_id);
        await refreshAll();
      } catch (err) {
        setStatus('Create user failed: ' + err.message, true);
      }
    }

    async function updateRole() {
      try {
        const payload = {
          user_id: Number(byId('roleUserId').value || 0),
          role: byId('roleValue').value,
        };
        await api('/45/api/admin/users/role', 'POST', payload, { withCsrf: true });
        setStatus('Role updated.');
        await refreshAll();
      } catch (err) {
        setStatus('Role update failed: ' + err.message, true);
      }
    }

    toggleAuthFields();
    refreshCsrf().then(refreshAll);
  </script>
</body>
</html>
