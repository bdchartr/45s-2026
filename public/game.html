    function flyCardToCenter(code, trump, fromRect, side) {
      const center = byId('center');
      if (!center || !fromRect) return Promise.resolve();

      const centerRect = center.getBoundingClientRect();
      const metrics = getTableCardMetrics();
      const cw = metrics.width;
      const ch = metrics.height;

      // Compute target viewport position matching the .card-{side} CSS rules
      var targetLeft, targetTop;
      if (side === 'north') {
        targetLeft = centerRect.left + centerRect.width / 2 - cw / 2;
        targetTop  = centerRect.top + 12;
      } else if (side === 'south') {
        targetLeft = centerRect.left + centerRect.width / 2 - cw / 2;
        targetTop  = centerRect.bottom - 12 - ch;
      } else if (side === 'west') {
        targetLeft = centerRect.left + 12;
        targetTop  = centerRect.top + centerRect.height / 2 - ch / 2;
      } else {
        targetLeft = centerRect.right - 12 - cw;
        targetTop  = centerRect.top + centerRect.height / 2 - ch / 2;
      }

      // Start at the hand chip's centre, sized as a table card
      var startLeft = fromRect.left + (fromRect.width  - cw) / 2;
      var startTop  = fromRect.top  + (fromRect.height - ch) / 2;
      var dx = targetLeft - startLeft;
      var dy = targetTop  - startTop;

      var fly = document.createElement('div');
      fly.className = 'table-card fly-card' + (isRedSuit(suitOf(code)) ? ' red' : '');
      fly.innerHTML = tableCardHtml(code, trump);
      fly.style.cssText =
        'left:' + startLeft + 'px;' +
        'top:'  + startTop  + 'px;' +
        'width:' + cw + 'px;' +
        'height:' + ch + 'px;' +
        'transform:scale(0.72) rotate(-3deg);';
      document.body.appendChild(fly);

      // Trump cards get a brief gold-rim lift before arcing to the felt
      var isTrump = trump && suitOf(code) === trump;
      if (isTrump) {
        fly.style.boxShadow = '0 0 0 2px var(--gold), 0 8px 18px rgba(0,0,0,.45)';
      }

      // Force reflow then start transition (450ms easeOutCubic)
      void fly.offsetWidth;
      fly.style.transition =
        'transform 0.45s cubic-bezier(0.33,1,0.68,1),' +
        'opacity   0.45s ease,' +
        'box-shadow 0.3s ease';
      fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1) rotate(2deg)';
      if (isTrump) {
        // Fade gold rim as card settles
        setTimeout(function() { fly.style.boxShadow = ''; }, 200);
      }

      return new Promise(function (resolve) {
        setTimeout(function () {
          if (fly.parentNode) fly.parentNode.removeChild(fly);
          resolve();
        }, 500);
      });
    }

    async function playCard(code) {
      if (!Number.isInteger(app.viewerSeat)) {
        status('Join the game before playing.', 'error');
        return;
      }
      if (!code) return;
      try {
        // Capture hand chip position before removing it
        const chipEl = document.querySelector('[data-card="' + code + '"]');
        const fromRect = chipEl ? chipEl.getBoundingClientRect() : null;
        const trump    = app.hand ? app.hand.trump_suit : null;

        // Remove card from local hand immediately for instant feedback
        app.viewerHand = app.viewerHand.filter(function (c) { return c !== code; });
        renderPlayerZone('south');

        status('Playing ' + cardLabel(code) + '…', '');

        // Fly animation + API call run in parallel
        await Promise.all([
          flyCardToCenter(code, trump, fromRect, 'south'),
          api('/api/game/play_card', 'POST', {
            game_id: app.gameId,
            seat: app.viewerSeat,
            card: code,
          }, true),
        ]);

        status('Played ' + cardLabel(code), 'success');
        await refreshAll();
      } catch (err) {
        // Restore card on failure
        if (!app.viewerHand.includes(code)) {
          app.viewerHand.push(code);
          renderPlayerZone('south');
        }
        status('Play failed: ' + err.message, 'error');
      }
    }

    function toggleDiscard(code) {
      const idx = app.selectedDiscards.indexOf(code);
      if (idx === -1) {
        app.selectedDiscards.push(code);
      } else {
        app.selectedDiscards.splice(idx, 1);
      }
      // Re-render just the viewer zone and controls (fast, no server round-trip)
      const viewerSide = app.viewerSeat !== null
        ? ['south', 'west', 'north', 'east'][(0 + 4) % 4]  // viewer is always south
        : null;
      renderPlayerZone('south');
      renderControls();
    }

    async function discardCards() {
      if (!Number.isInteger(app.viewerSeat)) {
        status('Not seated.', 'error');
        return;
      }
      try {
        const cards = app.selectedDiscards.slice();
        status('Discarding ' + cards.length + ' card(s)…', '');
        await api('/api/game/discard_cards', 'POST', {
          game_id: app.gameId,
          seat: app.viewerSeat,
          cards: cards,
        }, true);
        app.selectedDiscards = [];
        status('Discard submitted.', 'success');
        await refreshAll();
      } catch (err) {
        status('Discard failed: ' + err.message, 'error');
      }
    }

    async function declareTrump(trump) {
      if (!Number.isInteger(app.viewerSeat)) return;
      try {
        status('Declaring ' + SUIT_NAME[trump] + '…', '');
        await api('/api/game/declare_trump', 'POST', {
          game_id: app.gameId,
          seat: app.viewerSeat,
          trump: trump,
        }, true);
        status(SUIT_NAME[trump] + ' is trump.', 'success');
        await refreshAll();
      } catch (err) {
        status('Trump failed: ' + err.message, 'error');
      }
    }

    function bindEvents() {
      byId('refreshBtn').addEventListener('click', refreshAll);
    }

    function parseGameId() {
      const q = new URLSearchParams(window.location.search);
      const id = Number(q.get('game_id') || '0');
      return Number.isInteger(id) && id > 0 ? id : 0;
    }

    async function boot() {
      app.gameId = parseGameId();
      if (app.gameId <= 0) {
        status('Missing or invalid game_id in query string.', 'error');
        byId('gameMeta').textContent = 'Open this page with ?game_id=123';
        return;
      }

      bindEvents();
      await refreshAll();

      app.pollingId = window.setInterval(function () {
        refreshAll();
      }, 2000);
    }

    boot();
  </script>
</body>
