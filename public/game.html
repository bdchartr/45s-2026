<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>45</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      /* Direction A — Kitchen Table palette */
      --felt:       #2f4e35;
      --felt-dark:  #1f3826;
      --felt-mid:   #3a5e41;
      --paper:      #f4ecdb;
      --paper2:     #ebe0c7;
      --cream:      #fbf6ea;
      --birch:      #e4d9c1;
      --ink:        #1f1a12;
      --ink2:       #3a3124;
      --muted:      #7a6a4c;
      --line:       #c9b98e;
      --line2:      #a89774;
      --wood:       #5e3f1f;
      --wood2:      #3e2812;
      --accent:     #a33822;
      --accentD:    #742515;
      --maple:      #c47a1e;
      --gold:       #a67a2d;
      --good:       #3e6b3a;
      --warn:       #c47a1e;
      --bad:        #a32121;
      --red-card:   #a5241b;
      /* Panel aliases */
      --panel:      #fbf6ea;
      --panel-2:    #ebe0c7;
      --border:     #c9b98e;
      --gold-bg:    #f5e9cc;
      --shadow:     0 10px 28px rgba(50,30,0,0.14);
      --shadow-deep:0 24px 60px rgba(50,30,0,0.45);
      --table-card-width: 62px;
      --table-card-height: 86px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Work Sans', system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 50%, var(--wood) 0%, var(--wood2) 70%),
        repeating-linear-gradient(90deg, transparent 0 40px, rgba(0,0,0,.09) 40px 41px),
        var(--wood2);
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    .shell {
      width: min(100%, 1080px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    /* ── Panels ── */
    .topbar, .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      box-shadow: var(--shadow);
    }

    .topbar {
      padding: 10px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      background: var(--paper2);
      border-bottom: 1px solid var(--wood2);
    }

    .topbar > * {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(22px, 3.5vw, 32px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .title-suit { font-size: 0.7em; vertical-align: middle; margin: 0 2px; }
    .title-suit.red { color: var(--red-card); }

    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 5px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--cream);
      max-width: 100%;
    }

    button, input {
      font: inherit;
      font-family: 'Work Sans', system-ui, sans-serif;
      border-radius: 0;
      border: 1px solid var(--line2);
      padding: 9px 14px;
      background: var(--cream);
      color: var(--ink);
    }

    button {
      border: 0;
      background: var(--ink);
      color: var(--cream);
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
      font-size: 14px;
      cursor: pointer;
      transition: background 80ms, transform 60ms;
      box-shadow: 0 3px 0 var(--wood2);
    }

    button:hover:not(:disabled) { background: var(--ink2); transform: translateY(-1px); }
    button.secondary { background: var(--wood); box-shadow: 0 3px 0 var(--wood2); }
    button.secondary:hover:not(:disabled) { background: var(--wood2); }
    button.warn { background: var(--maple); box-shadow: 0 3px 0 var(--wood2); }
    button.warn:hover:not(:disabled) { background: var(--accentD); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

    /* ── Board / Felt ── */
    .board {
      position: relative;
      background:
        radial-gradient(ellipse at 50% 50%, var(--felt-mid) 0%, var(--felt) 55%, var(--felt-dark) 100%);
      min-height: clamp(420px, 54vh, 680px);
      border-radius: 200px;
      border: 5px solid var(--wood2);
      overflow: hidden;
      box-shadow:
        inset 0 0 0 8px rgba(0,0,0,0.2),
        inset 0 0 0 10px rgba(255,255,255,0.04),
        0 20px 60px rgba(0,0,0,0.55);
      margin: 0 16px;
    }

    .felt-pattern {
      position: absolute;
      inset: 10px;
      border-radius: 200px;
      background:
        repeating-linear-gradient(45deg, transparent 0 3px, rgba(0,0,0,.07) 3px 4px),
        repeating-linear-gradient(-45deg, transparent 0 3px, rgba(255,255,255,.02) 3px 4px);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Player Zones ── */
    .player-zone {
      position: absolute;
      width: clamp(190px, 22vw, 242px);
      max-width: min(44vw, 242px);
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 10px 10px 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28);
      overflow: visible;
      z-index: 3;
    }

    .player-zone.turn {
      border-color: var(--gold);
      animation: pz-pulse 1.6s ease-in-out infinite;
    }
    @keyframes pz-pulse {
      0%, 100% {
        box-shadow:
          0 0 0 3px rgba(166,122,45,0.55),
          0 0 22px rgba(166,122,45,0.35),
          0 6px 18px rgba(0,0,0,0.28);
      }
      50% {
        box-shadow:
          0 0 0 4px rgba(196,148,52,0.85),
          0 0 36px rgba(196,148,52,0.55),
          0 6px 18px rgba(0,0,0,0.28);
      }
    }

    /* ── Turn indicator pill ── hangs off the table-facing edge */
    .turn-indicator {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--maple);
      color: var(--cream);
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 8;
      box-shadow: 0 3px 0 var(--wood2), 0 3px 14px rgba(196,122,30,0.5);
      animation: tiPulse 1s ease-in-out infinite alternate;
    }

    /* North zone — indicator hangs off bottom (facing table) */
    .zone-north .turn-indicator {
      top: calc(100% + 1px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 18px 8px;
      border-radius: 0 0 999px 999px;
      border-top: none;
    }

    /* South zone — indicator hangs off top (facing table) */
    .zone-south .turn-indicator {
      bottom: calc(100% + 1px);
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px 6px;
      border-radius: 999px 999px 0 0;
      border-bottom: none;
    }

    /* West zone — indicator hangs off right (facing table) */
    .zone-west .turn-indicator {
      left: calc(100% + 1px);
      top: 50%;
      transform: translateY(-50%);
      padding: 8px 8px 8px 6px;
      border-radius: 0 999px 999px 0;
      writing-mode: vertical-rl;
      gap: 4px;
    }

    /* East zone — indicator hangs off left (facing table) */
    .zone-east .turn-indicator {
      right: calc(100% + 1px);
      top: 50%;
      transform: translateY(-50%);
      padding: 8px 6px 8px 8px;
      border-radius: 999px 0 0 999px;
      writing-mode: vertical-lr;
      gap: 4px;
    }

    @keyframes tiPulse {
      from { box-shadow: 0 3px 0 var(--wood2), 0 2px 8px rgba(196,122,30,0.4);  filter: brightness(0.95); }
      to   { box-shadow: 0 3px 0 var(--wood2), 0 4px 22px rgba(196,122,30,0.75); filter: brightness(1.08); }
    }

    /* ── Board Action Overlay ── */
    .boa {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 6, 2, 0.22);
      pointer-events: none;
    }
    .boa-card {
      background: var(--cream);
      border: 1px solid var(--line);
      padding: 22px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(50,30,0,0.5), 0 2px 0 rgba(0,0,0,.04);
      min-width: 250px;
      max-width: min(90vw, 380px);
      position: relative;
      pointer-events: auto;
    }
    /* letterpress double-rule */
    .boa-card::before {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid var(--birch);
      pointer-events: none;
    }
    .boa-card > * { position: relative; }
    .boa-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--ink);
      margin: 0 0 4px;
    }
    .boa-trump {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.3px;
      margin-bottom: 10px;
    }
    .boa-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      min-height: 1em;
    }
    .boa-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .boa-btns button {
      min-width: 52px;
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 0;
    }
    .boa-btns .pass-btn { background: var(--wood); box-shadow: 0 3px 0 var(--wood2); }
    .boa-btns .pass-btn:hover:not(:disabled) { background: var(--wood2); }

    /* Compact, read-only preview of viewer hand inside bid/discard overlays
       so the player doesn't have to scroll to see their cards. */
    .boa-hand {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .boa-hand .card-chip {
      width: 44px;
      height: 60px;
      padding: 4px;
      cursor: default;
      box-shadow: 0 1px 0 rgba(0,0,0,0.18);
    }
    .boa-hand .card-chip .c-rank { font-size: 14px; }
    .boa-hand .card-chip .c-suit { font-size: 14px; }

    /* ── Hand result overlay (same layout as .boa) ── */
    .hand-result {
      position: absolute;
      inset: 0;
      z-index: 21;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 6, 2, 0.22);
      pointer-events: none;
    }
    .hand-result-inner {
      background: var(--cream);
      border: 1px solid var(--line);
      padding: 28px 36px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(50,30,0,0.55);
      min-width: 260px;
      max-width: min(90vw, 400px);
      position: relative;
      pointer-events: auto;
      animation: hr-appear 0.3s ease-out;
    }
    .hand-result-inner::before {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid var(--birch);
      pointer-events: none;
    }
    @keyframes hr-appear {
      from { opacity: 0; transform: scale(0.93); }
      to   { opacity: 1; transform: scale(1); }
    }
    .hr-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 12px;
      position: relative;
    }
    .hr-title.made { color: var(--felt); }
    .hr-title.lost { color: var(--accent); }
    .hr-scores {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.4px;
      line-height: 1.8;
      position: relative;
    }
    .hr-scores .delta-pos { color: var(--felt); font-weight: 700; }
    .hr-scores .delta-neg { color: var(--accent); font-weight: 700; }
    .hr-tricks {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.4px;
      margin-top: 14px;
      margin-bottom: 6px;
      position: relative;
    }
    .hr-actions {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .hr-actions button {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 16px;
      font-weight: 400;
      background: var(--ink);
      color: var(--cream);
      border: none;
      padding: 10px 28px;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .hr-actions button:hover { background: #2a1a08; }

    /* Per-player current-hand trick counter pill */
    .tricks-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 4px;
      padding: 2px 8px;
      background: rgba(232, 220, 196, 0.18);
      border: 1px solid var(--birch);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.6px;
      color: var(--cream);
      text-transform: uppercase;
    }
    .player-zone.zone-south .tricks-pill {
      background: rgba(46, 30, 12, 0.06);
      border-color: var(--birch);
      color: var(--ink);
    }
    .tricks-pill .tn { font-weight: 700; font-size: 12px; letter-spacing: 0.4px; }
    .hr-auto {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .hr-auto input { cursor: pointer; }

    /* ── Status panel ── */
    .sp-phase {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 4px;
    }
    .sp-turn { font-size: 13px; color: var(--muted); }
    .sp-turn.your-turn { color: var(--good); font-weight: 600; }

    .player-zone.dealer::after {
      content: '▲ DEAL';
      position: absolute;
      top: -14px;
      right: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2px;
      background: var(--maple);
      color: var(--cream);
      border-radius: 0;
      padding: 4px 10px;
      box-shadow: 0 3px 0 var(--wood2);
    }

    .zone-north { top: 12px; left: 50%; transform: translateX(-50%); }
    .zone-west { left: 12px; top: 50%; transform: translateY(-50%); }
    .zone-east { right: 12px; top: 50%; transform: translateY(-50%); }

    /* Opponent zones: thinner, overlapping card fan */
    .zone-north, .zone-west, .zone-east {
      width: clamp(128px, 15vw, 152px);
      max-width: 152px;
      padding: 8px 8px 12px;
    }
    .zone-north .hand,
    .zone-west .hand,
    .zone-east .hand {
      overflow: hidden;
      flex-wrap: nowrap;
      gap: 0;
    }
    .zone-north .hand .card-chip + .card-chip,
    .zone-west .hand .card-chip + .card-chip,
    .zone-east .hand .card-chip + .card-chip {
      margin-left: -14px;
    }

    /* South zone: full-width tray that overlaps the bottom of the felt so
       the viewer's cards visually sit on the table without the user having
       to scroll past it. The hand renders first (it lands on the felt
       thanks to the negative margin-top) followed by a horizontal status
       strip that mirrors the top info bar. z-index keeps the whole zone
       above the .center stacking layer so the cards aren't masked by the
       translucent center underlay or the kitty display. */
    .zone-south {
      position: relative;
      left: auto;
      bottom: auto;
      transform: none;
      width: 100%;
      max-width: 100%;
      padding: 0 20px 8px;
      margin-top: -132px;
      z-index: 10;
      box-shadow: none;
      border-top: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    /* Mini info bar mirroring .info-bar's look, sitting under the hand. */
    .viewer-status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      background: var(--paper2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 13px;
    }
    /* Bid badge appears here as a normal chip rather than its absolute
       hanging-tag form. */
    .viewer-status .bid-badge {
      position: static;
      bottom: auto;
      left: auto;
      font-size: 11px;
      padding: 4px 12px;
      letter-spacing: 0.5px;
    }
    .zone-south .hand {
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .player-name {
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
      font-size: 14px;
    }
    .player-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hand {
      margin-top: 8px;
      min-height: 52px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    /* ── Card Chips (mini playing cards) ── */
    .card-chip {
      position: relative;
      width: 38px;
      height: 54px;
      border-radius: 4px;
      border: 1px solid #d6cdb4;
      background: #fbfaf4;
      box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: default;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }

    .card-chip .c-rank {
      position: absolute;
      top: 3px;
      left: 4px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
    }

    .card-chip .c-suit {
      font-size: 20px;
      line-height: 1;
    }

    .zone-south .card-chip {
      width: 92px;
      height: 132px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18), 0 4px 14px rgba(0,0,0,.10);
    }

    .zone-south .card-chip .c-rank {
      top: 7px;
      left: 9px;
      font-size: 22px;
    }

    .zone-south .card-chip .c-suit {
      font-size: 52px;
    }

    .card-chip.back {
      background:
        linear-gradient(90deg, transparent 0 9px, rgba(0,0,0,.22) 9px 11px, transparent 11px 22px, rgba(255,255,255,.08) 22px 23px, transparent 23px),
        linear-gradient(0deg, transparent 0 9px, rgba(0,0,0,.22) 9px 11px, transparent 11px 22px, rgba(255,255,255,.08) 22px 23px, transparent 23px),
        repeating-linear-gradient(45deg, transparent 0 2px, rgba(0,0,0,.05) 2px 3px),
        var(--accent);
      background-size: 22px 22px, 22px 22px, auto, auto;
      border: 1px solid var(--accentD);
    }

    .card-chip.red { color: var(--red-card); }

    .card-chip.trump {
      border-color: var(--gold);
      background: linear-gradient(170deg, #fbfaf4 60%, var(--gold-bg) 100%);
      box-shadow: 0 0 0 2px rgba(166,122,45,0.28), 0 2px 6px rgba(0,0,0,0.12);
    }

    .card-chip.playable {
      cursor: pointer;
      transition: transform 100ms ease, box-shadow 100ms ease;
    }
    .card-chip.playable:hover {
      transform: translateY(-10px) rotate(-2deg);
      box-shadow: 0 12px 22px rgba(0,0,0,0.24);
      z-index: 10;
    }

    .card-chip.selected {
      border-color: var(--maple);
      background: linear-gradient(170deg, #fdf5e8 0%, #f5e4c0 100%);
      transform: translateY(-12px);
      box-shadow: 0 10px 20px rgba(196,122,30,0.32);
      z-index: 10;
    }

    /* ── Info Bar ── */
    .info-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      background: var(--paper2);
      border: 1px solid var(--border);
      border-radius: 0;
      box-shadow: var(--shadow);
      font-size: 13px;
    }

    .info-pill {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 4px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      max-width: 100%;
      min-width: 0;
      letter-spacing: 0.5px;
    }

    .info-pill .label { color: var(--muted); margin-right: 2px; }
    .info-pill.trump-pill { border-color: var(--gold); background: var(--gold-bg); color: var(--gold); }
    .info-pill.set-warn  { border-color: var(--bad); background: #fdf2f2; color: var(--bad); }

    /* ── Center Area ── */
    .center-underlay,
    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(360px, calc(100% - 420px));
      max-width: 78vw;
      height: min(300px, calc(100% - 140px));
      max-height: 60vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .center-underlay {
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      background: rgba(0,0,0,0.1);
      z-index: 1;
    }

    .center {
      z-index: 5;
    }

    .center-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-family: 'Work Sans', system-ui, sans-serif;
      letter-spacing: 0.06em;
      pointer-events: none;
    }

    /* ── Table Cards (center trick area) ── */
    .table-card {
      position: absolute;
      width: var(--table-card-width);
      height: var(--table-card-height);
      border-radius: 4px;
      border: 1px solid #d6cdb4;
      background: #fbfaf4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.32);
      font-family: 'JetBrains Mono', Consolas, monospace;
    }

    .table-card .c-rank {
      position: absolute;
      top: 5px;
      left: 7px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
    }

    .table-card .c-suit {
      font-size: 32px;
      line-height: 1;
    }

    .table-card.red { color: var(--red-card); }

    .card-north { top: 12px;    left: 50%; transform: translateX(-50%);  animation: cardFromNorth 550ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    .card-south { bottom: 12px; left: 50%; transform: translateX(-50%);  animation: cardFromSouth 550ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    .card-west  { left: 12px;   top: 50%;  transform: translateY(-50%);  animation: cardFromWest  550ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    .card-east  { right: 12px;  top: 50%;  transform: translateY(-50%);  animation: cardFromEast  550ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }

    /* Flying card overlay — used for the viewer's own card play */
    .fly-card {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      will-change: transform;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }

    .trick-collect-card {
      position: absolute;
      pointer-events: none;
      z-index: 6;
      will-change: transform, opacity;
      transition: transform 900ms ease-in-out, opacity 900ms ease;
    }

    /* Flying face-down card used during the deal animation */
    .fly-deal-card {
      position: fixed;
      pointer-events: none;
      z-index: 997;
      width: 42px;
      height: 60px;
      border-radius: 4px;
      background:
        linear-gradient(90deg, transparent 0 9px, rgba(0,0,0,.22) 9px 11px, transparent 11px 22px, rgba(255,255,255,.08) 22px 23px, transparent 23px),
        linear-gradient(0deg, transparent 0 9px, rgba(0,0,0,.22) 9px 11px, transparent 11px 22px, rgba(255,255,255,.08) 22px 23px, transparent 23px),
        repeating-linear-gradient(45deg, transparent 0 2px, rgba(0,0,0,.05) 2px 3px),
        var(--accent);
      background-size: 22px 22px, 22px 22px, auto, auto;
      border: 1px solid var(--accentD);
      box-shadow:
        inset 0 0 0 3px rgba(251,246,234,.2),
        0 3px 8px rgba(0,0,0,.4);
      will-change: transform, opacity;
    }

    /* Winner card glow before trick sweep */
    .trick-winner-glow {
      box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 0 4px var(--maple),
        0 0 16px rgba(196,122,30,.7) !important;
      transform-origin: center;
    }

    .trick-card-hidden {
      visibility: hidden;
    }

    /* ── Controls / Panel ── */
    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 14px;
    }

    .panel {
      padding: 16px;
      min-width: 0;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 17px;
      font-weight: 400;
      color: var(--ink);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .mt-10 { margin-top: 12px; }

    .line { font-size: 13px; color: var(--muted); }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      font-size: 13px;
      word-break: break-word;
    }

    .status.error { color: var(--bad); }
    .status.success { color: var(--good); }

    .status a {
      color: inherit;
      text-decoration: underline;
      font-weight: 700;
    }

    .log {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--cream);
      max-height: 220px;
      overflow: auto;
      font-size: 11px;
      padding: 8px;
      font-family: 'JetBrains Mono', Consolas, monospace;
      min-width: 0;
    }

    .log-line {
      border-bottom: 1px dotted var(--birch);
      padding: 4px 0;
      color: var(--muted);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .log-line:last-child { border-bottom: 0; }

    .muted { color: var(--muted); }

    .flow {
      margin-top: 10px;
      border: 1px solid #e0d4bc;
      border-radius: 10px;
      background: #fff;
      padding: 8px;
      display: grid;
      gap: 4px;
    }

    .flow-row {
      display: grid;
      grid-template-columns: minmax(0, 150px) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      font-size: 12px;
      border-bottom: 1px dotted #e6dac8;
      padding-bottom: 4px;
    }

    .flow-row:last-child { border-bottom: 0; padding-bottom: 0; }

    .flow-step { font-weight: 600; color: #3a2f22; }
    .flow-step, .flow-state, .line, .sub { overflow-wrap: anywhere; }

    .flow-state.done { color: var(--good); }
    .flow-state.active { color: var(--warn); }
    .flow-state.pending { color: var(--muted); }

    /* ── Trump buttons ── */
    .trump-btn-c { background: #2a3540; }
    .trump-btn-c:hover:not(:disabled) { background: #364553; }
    .trump-btn-d { background: #8e1a20; }
    .trump-btn-d:hover:not(:disabled) { background: #a51e26; }
    .trump-btn-h { background: #9e1c24; }
    .trump-btn-h:hover:not(:disabled) { background: #b82030; }
    .trump-btn-s { background: #252d38; }
    .trump-btn-s:hover:not(:disabled) { background: #303d4a; }

    /* ── Bid status badges ── */
    .bid-badge {
      position: absolute;
      bottom: -14px;
      left: 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      border-radius: 999px;
      padding: 6px 14px;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0,0,0,0.24);
    }
    .bid-badge.winning { background: linear-gradient(135deg, var(--felt-mid), var(--felt-dark)); color: #e8f5ee; }
    .bid-badge.pass    { background: #e0d8ca; color: #7a6e5c; }
    .bid-badge.outbid  { background: #e8d5b0; color: #7a5010; }

    /* ── Kitty display ── */
    .kitty-display {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .kitty-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(251,246,234,0.65);
    }
    .kitty-cards {
      display: flex;
      gap: 8px;
    }
    .kitty-cards .card-chip {
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      animation: kittyReveal 300ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    .kitty-cards .card-chip:nth-child(1) { animation-delay:   0ms; }
    .kitty-cards .card-chip:nth-child(2) { animation-delay:  80ms; }
    .kitty-cards .card-chip:nth-child(3) { animation-delay: 160ms; }

    /* ── Animations ── */
    @keyframes cardFromNorth {
      from { opacity: 0; transform: translateX(-50%) translateY(-60px) scale(0.85); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    @keyframes cardFromSouth {
      from { opacity: 0; transform: translateX(-50%) translateY(60px) scale(0.85); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    @keyframes cardFromWest {
      from { opacity: 0; transform: translateY(-50%) translateX(-60px) scale(0.85); }
      to   { opacity: 1; transform: translateY(-50%) translateX(0) scale(1); }
    }
    @keyframes cardFromEast {
      from { opacity: 0; transform: translateY(-50%) translateX(60px) scale(0.85); }
      to   { opacity: 1; transform: translateY(-50%) translateX(0) scale(1); }
    }
    @keyframes kittyReveal {
      from { opacity: 0; transform: translateY(12px) rotate(-4deg); }
      to   { opacity: 1; transform: translateY(0) rotate(0); }
    }

    @media (max-width: 1100px) {
      .topbar { grid-template-columns: 1fr; }
      .top-actions { justify-content: flex-start; }
      .controls { grid-template-columns: 1fr; }
      .board { min-height: clamp(500px, 68vh, 720px); }
      .center-underlay,
      .center { width: min(340px, calc(100% - 380px)); }
    }

    @media (max-width: 900px) {
      .zone-north, .zone-west, .zone-east { width: min(140px, 38vw); padding: 7px 7px 11px; }
      .center-underlay,
      .center {
        width: min(300px, calc(100% - 340px));
        height: min(270px, calc(100% - 130px));
      }
      .board { min-height: clamp(480px, 66vh, 660px); }
    }

    @media (max-width: 640px) {
      :root {
        --table-card-width: 52px;
        --table-card-height: 72px;
      }
      body { padding: 8px; }
      /* Opponent zones: tiny on mobile */
      .zone-north, .zone-west, .zone-east {
        width: min(118px, 32vw);
        max-width: 32vw;
        padding: 6px 6px 10px;
      }
      .zone-north .hand .card-chip + .card-chip,
      .zone-west .hand .card-chip + .card-chip,
      .zone-east .hand .card-chip + .card-chip {
        margin-left: -18px;
      }
      /* South zone stays full-width, cards scale down but remain prominent.
         Match the negative margin to the smaller card height so the
         overlap stays a clean "cards on the felt" effect. */
      .zone-south { padding: 6px 12px 10px; margin-top: -86px; }
      .zone-south .card-chip { width: 60px; height: 86px; border-radius: 5px; }
      .zone-south .card-chip .c-rank { top: 5px; left: 6px; font-size: 14px; }
      .zone-south .card-chip .c-suit { font-size: 34px; }
      .player-name { font-size: 13px; }
      .player-meta { font-size: 10px; }
      .hand { min-height: 42px; }
      .card-chip { width: 30px; height: 44px; }
      .card-chip .c-rank { font-size: 9px; }
      .card-chip .c-suit { font-size: 16px; }
      .table-card .c-rank { font-size: 11px; }
      .table-card .c-suit { font-size: 24px; }
      .flow-row { grid-template-columns: 1fr; gap: 2px; }
      .info-bar { gap: 6px; padding: 8px 12px; }
    }

    @media (max-width: 420px) {
      .zone-north, .zone-west, .zone-east {
        width: min(104px, 28vw);
        max-width: 28vw;
        padding: 5px 5px 8px;
      }
      .zone-south { margin-top: -74px; }
      .zone-south .card-chip { width: 52px; height: 74px; }
      .zone-south .card-chip .c-rank { font-size: 12px; top: 4px; left: 5px; }
      .zone-south .card-chip .c-suit { font-size: 28px; }
      .zone-north .hand .card-chip + .card-chip,
      .zone-west .hand .card-chip + .card-chip,
      .zone-east .hand .card-chip + .card-chip {
        margin-left: -20px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1 class="title"><span class="title-suit">♣</span><span class="title-suit red">♦</span> 45 <span class="title-suit red">♥</span><span class="title-suit">♠</span></h1>
        <div class="sub" id="gameMeta">Loading game...</div>
      </div>
      <div class="top-actions">
        <span class="chip" id="viewerMeta">—</span>
        <span class="chip" id="phaseMeta">—</span>
        <button class="secondary" id="refreshBtn">Refresh</button>
        <a href="/45/lobby.html">← Lobby</a>
      </div>
    </header>

    <div class="info-bar" id="infoBar"></div>

    <section class="board" id="board">
      <div class="felt-pattern"></div>
      <section class="center-underlay" aria-hidden="true"></section>

      <article class="player-zone zone-north" id="zone-north"></article>
      <article class="player-zone zone-west" id="zone-west"></article>
      <article class="player-zone zone-east" id="zone-east"></article>

      <section class="center" id="center">
        <div class="center-label" id="centerLabel">Waiting for trick play</div>
      </section>

      <div class="boa" id="boardActionOverlay" style="display:none"></div>
      <div id="handResult" class="hand-result" style="display:none">
        <div class="hand-result-inner">
          <div class="hr-title" id="hrTitle"></div>
          <div class="hr-scores" id="hrScores"></div>
          <div class="hr-tricks" id="hrTricks"></div>
          <div class="hr-actions">
            <button type="button" id="hrContinueBtn">Next hand</button>
            <label class="hr-auto">
              <input type="checkbox" id="hrAutoAdvance">
              <span>Auto-advance after 5 seconds</span>
            </label>
          </div>
        </div>
      </div>
    </section>

    <article class="player-zone zone-south" id="zone-south"></article>

    <section class="controls">
      <article class="panel">
        <div id="statusPanel"></div>
        <div id="actionStatus" class="status mt-10"></div>
      </article>

      <article class="panel">
        <h3>Game Log</h3>
        <div class="log" id="eventLog"></div>
      </article>
    </section>
  </div>

  <script src="player-modal.js"></script>
  <script>
    window.APP_BASE_PATH  = '/45';
    window.APP_CSRF_TOKEN = '';
    window.APP_USER_ID    = null;

    const app = {
      basePath: '/45',
      gameId: null,
      me: null,
      csrf: '',
      state: null,
      hand: null,      // current hand info: trump_suit, bid_winner_seat, bid_value
      scores: null,    // team0_total, team1_total, team0_sets, team1_sets
      players: [],
      events: [],
      viewerSeat: null,
      viewerHand: [],
      selectedDiscards: [],  // card codes selected for discard
      pollingId: null,
      refreshing: false,
      needsRefresh: false,
      actionInProgress: false,
      renderedTrickCards: { north: null, south: null, west: null, east: null },
      trickAnimation: null,
      trickAnimationTimers: [],
      lastAnimatedTrickKey: null,
      maxEventSeq: 0,
      lastDealSeq: 0,
    };

    const SUIT_SYM  = { C: '♣', D: '♦', H: '♥', S: '♠' };
    const SUIT_NAME = { C: 'Clubs', D: 'Diamonds', H: 'Hearts', S: 'Spades' };
    const TRICK_WINNER_EVENT_TYPES = ['trick_won', 'trick_resolved', 'trick_completed'];
    const TRICK_CARD_SETTLE_MS = 600;
    // Hold the winning card glow long enough for a person (not just a developer)
    // to register who took the trick before the cards sweep away.
    const TRICK_WINNER_GLOW_MS = 1400;
    const TRICK_COLLECTION_MS = 900;
    const TRICK_STAGGER_MS = 40;
    const TRICK_COLLECTION_BUFFER_MS = 200;

    // -------------------------------------------------------------------------
    // Card helpers
    // -------------------------------------------------------------------------

    function suitOf(code) {
      return code ? String(code).slice(-1).toUpperCase() : '';
    }

    function rankOf(code) {
      return code ? String(code).slice(0, -1) : '';
    }

    function isRedSuit(s) { return s === 'H' || s === 'D'; }

    function isTrumpCard(code, trump) {
      if (!trump || !code) return false;
      const s = suitOf(code);
      return s === trump || code === 'AH';
    }

    /** Build the display label for a card: rank + suit symbol */
    function cardLabel(code) {
      const s = suitOf(code);
      return rankOf(code) + (SUIT_SYM[s] || s);
    }

    /** CSS classes for a card chip (not including 'card-chip' itself) */
    function cardClasses(code, trump, extra) {
      const s = suitOf(code);
      const classes = [];
      if (isTrumpCard(code, trump)) classes.push('trump');
      if (isRedSuit(s)) classes.push('red');
      if (extra) classes.push(...extra);
      return classes.join(' ');
    }

    /** Build a mini playing-card chip element HTML string */
    function cardChipHtml(code, trump, extra) {
      const cls = ('card-chip ' + cardClasses(code, trump, extra)).trim();
      const rank = rankOf(code);
      const sym  = SUIT_SYM[suitOf(code)] || suitOf(code);
      return '<div class="' + cls + '" data-card="' + code + '">' +
        '<span class="c-rank">' + rank + '</span>' +
        '<span class="c-suit">' + sym + '</span>' +
        '</div>';
    }
    function cardChipEl(code, trump, extra) {
      const cls = ('card-chip ' + cardClasses(code, trump, extra)).trim();
      const e = document.createElement('div');
      e.className = cls;
      e.dataset.card = code;
      e.appendChild(mk('span', 'c-rank', rankOf(code)));
      e.appendChild(mk('span', 'c-suit', SUIT_SYM[suitOf(code)] || suitOf(code)));
      return e;
    }
    function appendTableCard(el, code) {
      el.appendChild(mk('span', 'c-rank', rankOf(code)));
      el.appendChild(mk('span', 'c-suit', SUIT_SYM[suitOf(code)] || suitOf(code)));
    }

    function getTableCardMetrics() {
      const rootStyle = window.getComputedStyle(document.documentElement);
      const width = parseFloat(rootStyle.getPropertyValue('--table-card-width')) || 62;
      const height = parseFloat(rootStyle.getPropertyValue('--table-card-height')) || 86;
      return { width: width, height: height };
    }

    function clearTrickAnimationTimers() {
      while (app.trickAnimationTimers.length > 0) {
        window.clearTimeout(app.trickAnimationTimers.pop());
      }
    }

    function removeTrickCollectionCards() {
      const center = byId('center');
      if (!center) return;
      Array.from(center.querySelectorAll('.trick-collect-card')).forEach(function (el) {
        el.remove();
      });
      Array.from(center.querySelectorAll('.trick-card-hidden')).forEach(function (el) {
        el.classList.remove('trick-card-hidden');
      });
    }

    function latestEventSeq(events) {
      let maxSeq = 0;
      for (let i = 0; i < events.length; i++) {
        const seq = Number(events[i].seq_no || 0);
        if (seq > maxSeq) maxSeq = seq;
      }
      return maxSeq;
    }

    function asIntOrNull(value) {
      const num = Number(value);
      return Number.isInteger(num) ? num : null;
    }

    function isTrickWinnerEventType(name) {
      return TRICK_WINNER_EVENT_TYPES.indexOf(String(name || '')) !== -1;
    }

    function deriveLatestCompletedTrick() {
      const emptyTable = { north: null, south: null, east: null, west: null };
      let current = [];
      let latest = null;

      for (let i = 0; i < app.events.length; i++) {
        const ev = app.events[i];
        if (ev.event_type === 'hand_dealt') {
          current = [];
          continue;
        }
        if (ev.event_type !== 'card_played') continue;

        current.push({
          seat: Number(ev.actor_seat),
          card: String(ev.payload && ev.payload.card ? ev.payload.card : '?'),
          seq: Number(ev.seq_no),
        });

        if (current.length !== 4) continue;

        let winnerEvent = null;
        for (let j = i + 1; j < app.events.length; j++) {
          const next = app.events[j];
          if (next.event_type === 'hand_dealt' || next.event_type === 'card_played') break;
          if (isTrickWinnerEventType(next.event_type)) {
            winnerEvent = next;
            break;
          }
        }

        if (winnerEvent) {
          const winnerSeat = asIntOrNull(winnerEvent.payload && (winnerEvent.payload.winner_seat ?? winnerEvent.payload.winning_seat));
          const winnerSide = winnerSeat === null ? null : sideForSeat(winnerSeat);
          const table = { north: null, south: null, east: null, west: null };
          current.forEach(function (play) {
            const side = sideForSeat(play.seat);
            if (side) table[side] = play.card;
          });

          latest = {
            key: String((winnerEvent.payload && winnerEvent.payload.trick_number) ?? current[0].seq) + ':' + String(winnerEvent.seq_no),
            winnerSeat: winnerSeat,
            winnerSide: winnerSide,
            winnerSeq: Number(winnerEvent.seq_no),
            trickNumber: asIntOrNull(winnerEvent.payload && winnerEvent.payload.trick_number),
            table: table,
          };
        }

        current = [];
      }

      return latest || { key: null, winnerSeat: null, winnerSide: null, winnerSeq: 0, trickNumber: null, table: emptyTable };
    }

    function finishTrickAnimation(key) {
      if (!app.trickAnimation || app.trickAnimation.key !== key) return;
      clearTrickAnimationTimers();
      removeTrickCollectionCards();
      app.trickAnimation = null;
      renderBoard();
    }

    function beginTrickCollection(key) {
      const anim = app.trickAnimation;
      if (!anim || anim.key !== key || anim.phase !== 'settle') return;

      anim.phase = 'collecting';
      const center = byId('center');
      // Fly the trick to the winner's player zone instead of a separate
      // corner stack — the per-player Tricks pill there is the new visual
      // home for trick counts.
      const target = anim.winnerSide ? byId('zone-' + anim.winnerSide) : null;
      if (!center || !target) {
        renderCenter();
        return;
      }

      removeTrickCollectionCards();

      const centerRect = center.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const metrics = getTableCardMetrics();
      const targetLeft = targetRect.left + (targetRect.width / 2) - centerRect.left - (metrics.width / 2);
      const targetTop = targetRect.top + (targetRect.height / 2) - centerRect.top - (metrics.height / 2);
      const offsets = [
        { x: -6, y: -5 },
        { x: 5, y: -2 },
        { x: -3, y: 6 },
        { x: 8, y: 4 },
      ];

      const cards = Array.from(center.querySelectorAll('.table-card[data-trick-side]'));

      // Phase 1: winner gets a maple glow for TRICK_WINNER_GLOW_MS
      cards.forEach(function (el) {
        if (el.dataset.trickSide === anim.winnerSide) {
          el.classList.add('trick-winner-glow');
          el.style.transition = 'box-shadow 0.15s ease, transform 0.15s ease';
          el.style.transform = (el.style.transform || '').replace(/scale\([^)]+\)/g, '') + ' scale(1.08)';
        }
      });

      // Phase 2: after glow hold, sweep all cards to winner stack with stagger
      setTimeout(function () {
        cards.forEach(function (el, index) {
          el.classList.remove('trick-winner-glow');
          el.style.transition = '';

          const rect = el.getBoundingClientRect();
          const startLeft = rect.left - centerRect.left;
          const startTop = rect.top - centerRect.top;
          const clone = el.cloneNode(true);
          clone.classList.remove('card-north', 'card-south', 'card-east', 'card-west', 'trick-card-hidden', 'trick-winner-glow');
          clone.classList.add('trick-collect-card');
          clone.style.left = startLeft + 'px';
          clone.style.top = startTop + 'px';
          clone.style.width = rect.width + 'px';
          clone.style.height = rect.height + 'px';
          clone.style.transition = 'none';
          center.appendChild(clone);
          el.classList.add('trick-card-hidden');

          const offset = offsets[index % offsets.length];
          const delay = index * TRICK_STAGGER_MS;
          setTimeout(function () {
            void clone.offsetWidth;
            clone.style.transition = 'transform ' + TRICK_COLLECTION_MS + 'ms ease-in-out, opacity ' + TRICK_COLLECTION_MS + 'ms ease';
            clone.style.transform = 'translate(' + ((targetLeft - startLeft) + offset.x) + 'px,' + ((targetTop - startTop) + offset.y) + 'px) scale(0.6) rotate(' + (Math.random() * 20 - 10) + 'deg)';
            clone.style.opacity = '0';

            // Flip face-down mid-sweep by swapping inner content to card-back style
            setTimeout(function () {
              clone.classList.add('fly-deal-card');
              clone.classList.remove('table-card', 'red');
              clone.style.background = '';
              clone.innerHTML = '';
            }, Math.round(TRICK_COLLECTION_MS * 0.4));
          }, delay);
        });
      }, TRICK_WINNER_GLOW_MS);

      renderCenter();
    }

    function startTrickAnimation(trick) {
      if (!trick || !trick.key) return;
      clearTrickAnimationTimers();
      removeTrickCollectionCards();
      app.trickAnimation = {
        key: trick.key,
        winnerSeat: trick.winnerSeat,
        winnerSide: trick.winnerSide,
        trickNumber: trick.trickNumber,
        table: trick.table,
        phase: 'settle',
      };
      app.lastAnimatedTrickKey = trick.key;

      app.trickAnimationTimers.push(window.setTimeout(function () {
        beginTrickCollection(trick.key);
      }, TRICK_CARD_SETTLE_MS));

      // Total sweep time = glow hold + stagger tail + collection duration + buffer
      const sweepTotal = TRICK_WINNER_GLOW_MS + (4 * TRICK_STAGGER_MS) + TRICK_COLLECTION_MS + TRICK_COLLECTION_BUFFER_MS;
      app.trickAnimationTimers.push(window.setTimeout(function () {
        finishTrickAnimation(trick.key);
      }, TRICK_CARD_SETTLE_MS + sweepTotal));
    }

    function syncTrickAnimation(previousMaxSeq) {
      const currentMaxSeq = latestEventSeq(app.events);
      const latestTrick = deriveLatestCompletedTrick();

      if (previousMaxSeq === 0) {
        app.maxEventSeq = currentMaxSeq;
        if (latestTrick.key) app.lastAnimatedTrickKey = latestTrick.key;
        return;
      }

      if (latestTrick.key && latestTrick.winnerSeq > previousMaxSeq && latestTrick.key !== app.lastAnimatedTrickKey) {
        startTrickAnimation(latestTrick);
      }

      app.maxEventSeq = currentMaxSeq;
    }

    // -------------------------------------------------------------------------
    // Hand result interstitial
    // -------------------------------------------------------------------------

    function teamLabel(teamNum) {
      const members = (app.players || []).filter(function(p) { return Number(p.team) === teamNum; });
      return members.length > 0
        ? members.map(function(p) { return displayNameForPlayer(p); }).join(' & ')
        : 'Team ' + teamNum;
    }

    let handResultTimer = null;
    // True from the instant a new hand_scored event is detected until the
    // user dismisses the resulting modal (or auto-advance fires). Used to
    // suppress the board-action overlay so the bidding modal for the *next*
    // hand can't pop up before the player has read the previous result.
    let handResultActive = false;
    const HAND_RESULT_AUTO_KEY = 'wkapp45.handResultAutoAdvance';
    const HAND_RESULT_AUTO_MS = 5000;

    function getHandResultAutoAdvance() {
      try { return localStorage.getItem(HAND_RESULT_AUTO_KEY) === '1'; }
      catch (e) { return false; }
    }
    function setHandResultAutoAdvance(on) {
      try { localStorage.setItem(HAND_RESULT_AUTO_KEY, on ? '1' : '0'); }
      catch (e) { /* ignore */ }
    }

    // Count tricks won per team for the hand ending at the given hand_scored event.
    function tricksTakenByTeam(handScoredEv) {
      const tricks = { 0: 0, 1: 0 };
      const scoredSeq = Number(handScoredEv.seq_no);
      for (let i = app.events.length - 1; i >= 0; i--) {
        const e = app.events[i];
        const seq = Number(e.seq_no);
        if (seq >= scoredSeq) continue;
        if (e.event_type === 'hand_dealt') break;
        if (TRICK_WINNER_EVENT_TYPES.indexOf(e.event_type) === -1) continue;
        const ws = (e.payload && (e.payload.winner_seat ?? e.payload.winning_seat));
        if (ws == null) continue;
        const seat = Number(ws);
        const player = playerBySeat(seat);
        if (!player) continue;
        const team = Number(player.team);
        if (team === 0 || team === 1) tricks[team]++;
      }
      return tricks;
    }

    function hideHandResult() {
      const overlay = document.getElementById('handResult');
      if (overlay) overlay.style.display = 'none';
      if (handResultTimer) {
        clearTimeout(handResultTimer);
        handResultTimer = null;
      }
      handResultActive = false;
      // Re-render so the bidding/discard overlay for the new hand can take
      // its turn now that the player has acknowledged the result.
      renderBoardOverlay();
    }

    function showHandResult(ev) {
      const p = ev.payload || {};
      const bidTeam   = Number(p.bid_team ?? -1);
      const bidValue  = Number(p.bid_value ?? 0);
      const bidMade   = !!p.bid_made;
      const is3060    = !!p.is_30_for_60;
      const d0        = Number(p.team0_delta ?? 0);
      const d1        = Number(p.team1_delta ?? 0);
      const t0        = Number(p.team0_total ?? 0);
      const t1        = Number(p.team1_total ?? 0);
      const target    = Number((app.state || {}).target_score || 120);

      const bidLabel  = is3060 ? '30-for-60' : String(bidValue);
      const bidderName = teamLabel(bidTeam);

      const titleEl   = document.getElementById('hrTitle');
      const scoresEl  = document.getElementById('hrScores');
      const tricksEl  = document.getElementById('hrTricks');
      const overlay   = document.getElementById('handResult');
      const continueBtn = document.getElementById('hrContinueBtn');
      const autoCheck   = document.getElementById('hrAutoAdvance');
      if (!titleEl || !scoresEl || !overlay) return;

      titleEl.className = 'hr-title ' + (bidMade ? 'made' : 'lost');
      titleEl.textContent = bidMade
        ? bidderName + ' made ' + bidLabel
        : bidderName + ' lost the ' + bidLabel + ' bid';

      const makeScoreLine = function(label, d, total, tgt) {
        const line = document.createElement('span');
        line.appendChild(document.createTextNode(label + ': '));
        const delta = mk('span', d >= 0 ? 'delta-pos' : 'delta-neg', (d >= 0 ? '+' : '') + d);
        line.appendChild(delta);
        line.appendChild(document.createTextNode(' → ' + total + '/' + tgt));
        return line;
      };
      scoresEl.innerHTML = '';
      scoresEl.appendChild(makeScoreLine(teamLabel(0), d0, t0, target));
      scoresEl.appendChild(document.createElement('br'));
      scoresEl.appendChild(makeScoreLine(teamLabel(1), d1, t1, target));

      if (tricksEl) {
        const tricks = tricksTakenByTeam(ev);
        tricksEl.textContent = 'Tricks: ' + teamLabel(0) + ' ' + tricks[0]
                              + ' · ' + teamLabel(1) + ' ' + tricks[1];
      }

      if (autoCheck) {
        autoCheck.checked = getHandResultAutoAdvance();
        autoCheck.onchange = function() {
          setHandResultAutoAdvance(autoCheck.checked);
          // If user just turned auto-advance ON while modal is open, start the timer now.
          if (autoCheck.checked && handResultTimer === null && overlay.style.display !== 'none') {
            handResultTimer = setTimeout(hideHandResult, HAND_RESULT_AUTO_MS);
          } else if (!autoCheck.checked && handResultTimer !== null) {
            clearTimeout(handResultTimer);
            handResultTimer = null;
          }
        };
      }
      if (continueBtn) {
        continueBtn.onclick = hideHandResult;
      }

      overlay.style.display = '';
      if (handResultTimer) clearTimeout(handResultTimer);
      handResultTimer = null;
      if (getHandResultAutoAdvance()) {
        handResultTimer = setTimeout(hideHandResult, HAND_RESULT_AUTO_MS);
      }
    }

    function syncHandResult(previousMaxSeq) {
      if (previousMaxSeq === 0) return;
      const animDelay = TRICK_CARD_SETTLE_MS + TRICK_WINNER_GLOW_MS + (4 * TRICK_STAGGER_MS) + TRICK_COLLECTION_MS + 400;
      for (let i = app.events.length - 1; i >= 0; i--) {
        const ev = app.events[i];
        if (ev.event_type === 'hand_scored' && Number(ev.seq_no) > previousMaxSeq) {
          // Flip the suppression flag immediately — the server has already
          // dealt the next hand and the bidding overlay would otherwise
          // race ahead of our delayed score-summary modal.
          handResultActive = true;
          renderBoardOverlay();
          setTimeout(function() { showHandResult(ev); }, animDelay);
          break;
        }
      }
    }

    // -------------------------------------------------------------------------
    // Player name helpers
    // -------------------------------------------------------------------------

    function seatDisplayName(seat) {
      if (seat === null || seat === undefined) return '?';
      const p = playerBySeat(Number(seat));
      return p ? displayNameForPlayer(p) : ('Seat ' + (Number(seat) + 1));
    }

    // -------------------------------------------------------------------------
    // Friendly event descriptions
    // -------------------------------------------------------------------------

    // 'You play' but 'Margaret plays' — pick the right verb form for the actor.
    function actorPhrase(actor, verbStem) {
      return actor === 'You' ? (actor + ' ' + verbStem) : (actor + ' ' + verbStem + 's');
    }

    function friendlyEventText(ev) {
      const p = ev.payload || {};
      const actor = seatDisplayName(ev.actor_seat);
      switch (String(ev.event_type)) {
        case 'hand_dealt':     return 'New hand dealt';
        case 'hand_started':   return 'Hand started';
        case 'game_created':   return 'Game created';
        case 'bid_action':
          return p.bid === 'pass' ? actor + ' passed' : actor + ' bid ' + p.bid;
        case 'forced_dealer_bid':
          return actor === 'You' ? 'You were forced to bid 15' : actor + ' was forced to bid 15';
        case 'bidding_closed': {
          const winner = seatDisplayName(p.winning_seat);
          return actorPhrase(winner, 'win') + ' the bid (' + (p.winning_bid ?? '?') + ')';
        }
        case 'trump_declared': {
          // Server payload uses trump_suit; older events may have used trump.
          const code = p.trump_suit || p.trump || '';
          const suit = SUIT_NAME[code] || code || '?';
          const sym  = SUIT_SYM[code]  || '';
          return actorPhrase(actor, 'declare') + ' ' + suit + ' ' + sym + ' as trump';
        }
        case 'kitty_picked_up':
          return actorPhrase(actor, 'pick') + ' up the kitty';
        case 'discard_action': {
          // Server payload uses 'discarded' (array of card codes).
          const n = Array.isArray(p.discarded) ? p.discarded.length
                  : (p.count != null ? p.count
                  : (Array.isArray(p.cards) ? p.cards.length : 0));
          return actorPhrase(actor, 'discard') + ' ' + n + ' card' + (n === 1 ? '' : 's');
        }
        case 'dealer_draw_extra':   return actorPhrase(actor, 'draw') + ' extra cards (dealer kitty)';
        case 'dealer_draw_discard': return actorPhrase(actor, 'discard') + ' extra cards (dealer)';
        case 'trick_play_started':  return 'Trick play begins';
        case 'card_played': {
          const card = p.card ? cardLabel(p.card) : '?';
          return actorPhrase(actor, 'play') + ' ' + card;
        }
        case 'trick_won':
        case 'trick_resolved':
        case 'trick_completed': {
          const winner = seatDisplayName(p.winner_seat ?? p.winning_seat);
          const tn = p.trick_number != null ? ' (trick ' + p.trick_number + ')' : '';
          return actorPhrase(winner, 'win') + ' the trick' + tn;
        }
        case 'hand_scored':  return 'Hand scored';
        case 'game_over':    return 'Game over';
        default:
          return String(ev.event_type).replace(/_/g, ' ');
      }
    }

    // -------------------------------------------------------------------------
    // Board Action Overlay (bid / trump / discard)
    // -------------------------------------------------------------------------

    const BID_LADDER = [15, 20, 25, 30, 60];

    function currentHighBid() {
      const status = deriveBidStatus();
      var high = 0;
      for (var s in status) {
        var bs = status[s];
        if (bs.cls === 'winning') { high = parseInt(bs.bid) || 0; }
      }
      return high;
    }

    function renderBoardOverlay() {
      const overlay = byId('boardActionOverlay');
      if (!overlay) return;

      // While an action is in-flight, hide the overlay so buttons can't be
      // clicked again and re-renders don't expose stale buttons.
      if (app.actionInProgress) {
        overlay.style.display = 'none';
        return;
      }

      // Hand-result modal is pending or visible — keep the next hand's
      // bidding/discard overlay suppressed until the player dismisses it,
      // so the flow reads: last trick → score summary → bid prompt.
      if (handResultActive) {
        overlay.style.display = 'none';
        return;
      }

      const g = app.state || {};
      const phase = String(g.current_phase || '');
      const seated = Number.isInteger(app.viewerSeat);
      const myTurn = seated && Number(g.current_turn_seat) === Number(app.viewerSeat);

      overlay.innerHTML = '';
      let show = false;

      if (phase === 'bidding' && myTurn) {
        show = true;
        const high = currentHighBid();
        const isDealer = Number(g.dealer_seat) === Number(app.viewerSeat);
        const hintText = high > 0
          ? (isDealer
              ? 'Highest bid is ' + high + '. Match it to take the bid, or bid higher.'
              : 'Highest bid is ' + high + '. Bid higher to take it, or pass.')
          : 'Open the bidding';
        const card = mk('div', 'boa-card');
        card.appendChild(mk('div', 'boa-title', 'Your Bid'));
        card.appendChild(mk('div', 'boa-hint', hintText));
        const btns = mk('div', 'boa-btns');
        const passBtn = mk('button', 'pass-btn', 'Pass');
        passBtn.onclick = function() { submitBid('pass'); };
        btns.appendChild(passBtn);
        BID_LADDER.forEach(function(b) {
          var tooLow = high > 0 && (isDealer ? b < high : b <= high);
          var label = b === 60 ? '30-for-60' : String(b);
          var btn = mk('button', null, label);
          if (b === 60) btn.title = 'Bid 30 to win 60: a special bid worth double points if you make it, double the loss if you miss it.';
          if (tooLow) btn.disabled = true;
          btn.onclick = (function(bid) { return function() { submitBid(bid); }; })(b);
          btns.appendChild(btn);
        });
        card.appendChild(btns);
        // Read-only mini-hand inside the modal so the user can see their cards
        // without scrolling. Bidding has no trump yet, so highlights are off.
        if (Array.isArray(app.viewerHand) && app.viewerHand.length > 0) {
          const previewRow = mk('div', 'boa-hand');
          for (let i = 0; i < app.viewerHand.length; i++) {
            previewRow.appendChild(cardChipEl(app.viewerHand[i], null, []));
          }
          card.appendChild(previewRow);
        }
        overlay.appendChild(card);

      } else if (phase === 'declare_trump' && myTurn) {
        show = true;
        const h = app.hand || {};
        const bidLabel = h.bid_value ? (h.bid_value === 60 ? '30-for-60' : h.bid_value) : '';
        const hintText = bidLabel ? 'You bid ' + bidLabel : 'You won the bid';
        const card = mk('div', 'boa-card');
        card.appendChild(mk('div', 'boa-title', 'Choose Trump'));
        card.appendChild(mk('div', 'boa-hint', hintText));
        const btns = mk('div', 'boa-btns');
        [['C', '♣ Clubs', 'trump-btn-c'], ['D', '♦ Diamonds', 'trump-btn-d'],
         ['H', '♥ Hearts', 'trump-btn-h'], ['S', '♠ Spades', 'trump-btn-s']].forEach(function(t) {
          var btn = mk('button', t[2], t[1]);
          btn.onclick = (function(suit) { return function() { declareTrump(suit); }; })(t[0]);
          btns.appendChild(btn);
        });
        card.appendChild(btns);
        // Read-only mini-hand inside the modal so the user sees their cards
        // while picking trump.
        if (Array.isArray(app.viewerHand) && app.viewerHand.length > 0) {
          const previewRow = mk('div', 'boa-hand');
          for (let i = 0; i < app.viewerHand.length; i++) {
            previewRow.appendChild(cardChipEl(app.viewerHand[i], null, []));
          }
          card.appendChild(previewRow);
        }
        overlay.appendChild(card);

      } else if (phase === 'discard_phase' && seated) {
        show = true;
        const card = mk('div', 'boa-card');
        if (viewerHasDiscarded()) {
          card.appendChild(mk('div', 'boa-title', 'Waiting…'));
          card.appendChild(mk('div', 'boa-hint', 'Waiting for other players to discard…'));
        } else {
          const nSel = app.selectedDiscards.length;
          const handLen = Array.isArray(app.viewerHand) ? app.viewerHand.length : 5;
          const isBidWinner = app.hand && Number(app.hand.bid_winner_seat) === Number(app.viewerSeat);
          let hintText;
          if (nSel === 0) {
            hintText = isBidWinner
              ? 'Click cards in your hand to discard. You need to keep 5.'
              : 'Click cards to discard, or click Keep All to keep your hand.';
          } else {
            hintText = 'Discard ' + nSel + ' card' + (nSel === 1 ? '' : 's')
                     + ' · keep ' + (handLen - nSel);
          }
          card.appendChild(mk('div', 'boa-title', 'Discard'));
          const trump = app.hand ? app.hand.trump_suit : null;
          if (trump) {
            const trumpEl = mk('div', 'boa-trump');
            trumpEl.appendChild(document.createTextNode('Trump: '));
            const sym = mk('span', null, SUIT_SYM[trump] + ' ' + SUIT_NAME[trump]);
            sym.style.color = isRedSuit(trump) ? '#b91c1c' : '#1a1f25';
            sym.style.fontWeight = '600';
            trumpEl.appendChild(sym);
            card.appendChild(trumpEl);
          }
          const hintEl = mk('div', 'boa-hint', hintText);
          hintEl.id = 'discardHint';
          card.appendChild(hintEl);
          const btns = mk('div', 'boa-btns');
          const confirmLabel = nSel === 0
            ? (isBidWinner ? 'Confirm' : 'Keep All')
            : 'Confirm Discard';
          const confirmBtn = mk('button', null, confirmLabel);
          confirmBtn.onclick = discardCards;
          btns.appendChild(confirmBtn);
          card.appendChild(btns);
        }
        overlay.appendChild(card);
      }

      overlay.style.display = show ? '' : 'none';
    }

    // -------------------------------------------------------------------------
    // Status panel (below board, left column)
    // -------------------------------------------------------------------------

    function renderStatusPanel() {
      const el = byId('statusPanel');
      if (!el) return;
      const g = app.state || {};
      const phase = String(g.current_phase || '');
      const phaseNames = {
        bidding: 'Bidding',
        declare_trump: 'Trump Declaration',
        discard_phase: 'Discard',
        trick_play: 'Trick Play',
      };
      const seated = Number.isInteger(app.viewerSeat);
      const myTurn = seated && Number(g.current_turn_seat) === Number(app.viewerSeat);
      const turnSeat = g.current_turn_seat != null ? Number(g.current_turn_seat) : null;
      const phaseName = phaseNames[phase] || (phase ? phase.replace(/_/g, ' ') : null);

      el.innerHTML = '';
      if (phaseName) el.appendChild(mk('div', 'sp-phase', phaseName));

      if (phase === 'discard_phase' && seated) {
        // current_turn_seat is the bid winner as a reference, not a turn indicator.
        // Use the viewer's own discard event to determine their status.
        if (viewerHasDiscarded()) {
          el.appendChild(mk('div', 'sp-turn', 'Discard submitted — waiting for others…'));
        } else {
          el.appendChild(mk('div', 'sp-turn your-turn', 'Select cards to discard, then confirm'));
        }
      } else if (myTurn && phase === 'trick_play') {
        el.appendChild(mk('div', 'sp-turn your-turn', 'Play a card from your hand'));
      } else if (myTurn) {
        el.appendChild(mk('div', 'sp-turn your-turn', 'Your turn'));
      } else if (turnSeat !== null && phase) {
        el.appendChild(mk('div', 'sp-turn', 'Waiting for ' + seatDisplayName(turnSeat) + '…'));
      }
    }

    // -------------------------------------------------------------------------
    // Info bar
    // -------------------------------------------------------------------------

    function renderInfoBar() {
      const bar = byId('infoBar');
      const g = app.state || {};
      const h = app.hand || {};
      const sc = app.scores || {};
      const phase = String(g.current_phase || '');

      bar.innerHTML = '';

      // Trump
      const trump = h.trump_suit || null;
      if (trump) {
        const sym = SUIT_SYM[trump] || trump;
        const red = isRedSuit(trump) ? 'color:#b91c1c' : 'color:#1a1f25';
        const pill = mk('div', 'info-pill trump-pill');
        pill.appendChild(mk('span', 'label', 'Trump'));
        const symSpan = mk('span', null, sym);
        symSpan.style.cssText = 'font-size:16px;' + red;
        pill.appendChild(symSpan);
        pill.appendChild(document.createTextNode(' ' + SUIT_NAME[trump]));
        bar.appendChild(pill);
      } else if (phase === 'bidding' || phase === 'declare_trump') {
        const pill = mk('div', 'info-pill');
        pill.appendChild(mk('span', 'label', 'Trump'));
        pill.appendChild(document.createTextNode('TBD'));
        bar.appendChild(pill);
      }

      // Bid winner + bid value
      const bidWinner = h.bid_winner_seat != null ? Number(h.bid_winner_seat) : null;
      const bidValue  = h.bid_value != null ? Number(h.bid_value) : null;
      if (bidWinner !== null && bidValue !== null) {
        const label = bidValue === 60 ? '30-for-60' : String(bidValue);
        const isViewerBidder = Number(bidWinner) === Number(app.viewerSeat);
        const pill = mk('div', 'info-pill');
        pill.appendChild(mk('span', 'label', isViewerBidder ? 'Your bid' : 'Bid'));
        const text = isViewerBidder
          ? label
          : (seatDisplayName(bidWinner) + ' bid ' + label);
        pill.appendChild(document.createTextNode(text));
        bar.appendChild(pill);
      }

      // Scores — show team member names instead of "Team 0 (0,2)"
      const t0 = Number(sc.team0_total ?? 0);
      const t1 = Number(sc.team1_total ?? 0);
      const s0 = Number(sc.team0_sets  ?? 0);
      const s1 = Number(sc.team1_sets  ?? 0);
      const target = Number(g.target_score || 120);

      // Render small set count as a word so "One Set" reads better than "1 set".
      const SET_WORDS = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six'];
      const setLabel = function(n) {
        if (n <= 0) return '';
        const word = SET_WORDS[n] || String(n);
        return word + (n === 1 ? ' Set' : ' Sets');
      };
      const makeScorePill = function(teamNum, total, sets, extraCls) {
        const pill = mk('div', 'info-pill' + extraCls);
        pill.appendChild(mk('span', 'label', teamLabel(teamNum)));
        const scoreText = total + '/' + target + (sets > 0 ? ' · ' + setLabel(sets) : '');
        pill.appendChild(document.createTextNode(scoreText));
        return pill;
      };
      bar.appendChild(makeScorePill(0, t0, s0, s0 >= 2 ? ' set-warn' : ''));
      bar.appendChild(makeScorePill(1, t1, s1, s1 >= 2 ? ' set-warn' : ''));

      // Hand / trick progress
      const hand = Number(g.hand_number || 1);
      const cardPlays = app.events.filter(function (e) { return e.event_type === 'card_played'; }).length;
      const completedTricks = Math.floor(cardPlays / 4);
      const handPill = mk('div', 'info-pill');
      handPill.appendChild(mk('span', 'label', 'Hand'));
      if (phase === 'trick_play') {
        handPill.appendChild(document.createTextNode(hand + ' · Trick ' + (completedTricks + 1) + '/5'));
      } else {
        handPill.appendChild(document.createTextNode(String(hand)));
      }
      bar.appendChild(handPill);
    }

    // -------------------------------------------------------------------------

    function byId(id) { return document.getElementById(id); }
    function mk(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = String(text);
      return e;
    }

    function seatName(seat) {
      const n = Number(seat);
      // Seats are stored 0-based internally but displayed 1-based for humans.
      return Number.isInteger(n) ? ('Seat ' + (n + 1)) : 'Seat ?';
    }

    function status(text, level) {
      const el = byId('actionStatus');
      el.textContent = text || '';
      el.className = 'status' + (level === 'error' ? ' error' : level === 'success' ? ' success' : '');
    }


    function jsonHeaders(withCsrf) {
      const h = { 'Content-Type': 'application/json' };
      if (withCsrf && app.csrf) h['X-CSRF-Token'] = app.csrf;
      return h;
    }

    async function api(path, method, body, withCsrf) {
      const opts = {
        method: method || 'GET',
        credentials: 'same-origin',
        headers: jsonHeaders(!!withCsrf),
      };
      if (body !== undefined && body !== null) opts.body = JSON.stringify(body);

      const res = await fetch(app.basePath + path, opts);
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        // Action endpoints return { ok:false, code, message }; auth/system
        // endpoints use { ok:false, error }. Prefer the human-readable
        // message, fall back to code, then the legacy error field.
        const msg = (data && (data.message || data.code || data.error))
                    || ('http_' + res.status);
        throw new Error(msg);
      }
      return data;
    }

    function relToSide(rel) {
      if (rel === 0) return 'south';
      if (rel === 1) return 'west';
      if (rel === 2) return 'north';
      return 'east';
    }

    function sideForSeat(absSeat) {
      if (!Number.isInteger(app.viewerSeat)) return null;
      const rel = (absSeat - app.viewerSeat + 4) % 4;
      return relToSide(rel);
    }

    function seatForSide(side) {
      if (!Number.isInteger(app.viewerSeat)) return null;
      if (side === 'south') return app.viewerSeat;
      if (side === 'west') return (app.viewerSeat + 1) % 4;
      if (side === 'north') return (app.viewerSeat + 2) % 4;
      if (side === 'east') return (app.viewerSeat + 3) % 4;
      return null;
    }

    function playerBySeat(seat) {
      for (let i = 0; i < app.players.length; i++) {
        if (Number(app.players[i].seat) === Number(seat)) return app.players[i];
      }
      return null;
    }

    function displayNameForPlayer(p) {
      if (!p) return 'Open';
      if (Number(p.user_id) === Number(app.me && app.me.user_id)) return 'You';
      if (Number(p.is_ai) === 1) return p.display_name || 'AI';
      if (p.user_id) return p.display_name || p.username || ('Player #' + p.user_id);
      return 'Open Seat';
    }

    function playerNameEl(p) {
      const name = displayNameForPlayer(p);
      if (!p) return document.createTextNode(name);
      if (Number(p.is_ai) === 1) {
        const span = document.createElement('span');
        span.style.cssText = 'cursor:pointer;text-decoration:underline;text-underline-offset:2px';
        span.textContent = name;
        span.addEventListener('click', (function(desc) { return function() { openPlayerModal(desc); }; })(
          { kind: 'ai', display_name: p.display_name || name, seat: p.seat }
        ));
        return span;
      }
      if (!p.user_id) return document.createTextNode(name);
      const span = document.createElement('span');
      span.style.cssText = 'cursor:pointer;text-decoration:underline;text-underline-offset:2px';
      span.textContent = name;
      span.addEventListener('click', (function(uid) { return function() { openPlayerModal(uid); }; })(Number(p.user_id)));
      return span;
    }

    function renderPlayerZone(side) {
      const seat = seatForSide(side);
      const p = playerBySeat(seat);
      const zone = byId('zone-' + side);
      const g = app.state || {};
      const phase = String(g.current_phase || '');
      const trump = app.hand ? app.hand.trump_suit : null;
      const isDealer = seat !== null && Number(g.dealer_seat) === Number(seat);
      const isTurn   = seat !== null && Number(g.current_turn_seat) === Number(seat);
      const isViewer = seat !== null && Number(seat) === Number(app.viewerSeat);

      // Discard phase: viewer can always submit (turn order bypassed server-side)
      const canDiscard  = isViewer && phase === 'discard_phase' && !viewerHasDiscarded();
      const canPlay     = isViewer && phase === 'trick_play' && isTurn;

      zone.className = 'player-zone zone-' + side + (isDealer ? ' dealer' : '') + (isTurn ? ' turn' : '');

      const statusBits = [];
      if (p) {
        statusBits.push('team ' + p.team);
        if (Number(p.is_ai) === 1) statusBits.push('AI');
        if (Number(p.connected) !== 1) statusBits.push('disconnected');
      }

      // Bid badge element — only visible during bidding and declare_trump phases
      var bidBadgeEl = null;
      var currentPhase = String(g.current_phase || '');
      if ((currentPhase === 'bidding' || currentPhase === 'declare_trump') && seat !== null) {
        var bidStatus = deriveBidStatus();
        if (bidStatus[seat]) {
          var bs = bidStatus[seat];
          bidBadgeEl = mk('div', 'bid-badge ' + bs.cls, 'Bid: ' + String(bs.bid));
        }
      }

      // Turn indicator element
      var turnEl = null;
      if (isTurn) {
        var arrowIn = { north: '▼', south: '▲', west: '▶', east: '◀' }[side] || '▶';
        var phaseLabel = {
          bidding: 'Bid',
          declare_trump: 'Trump',
          discard_phase: 'Discard',
          trick_play: 'Play'
        }[phase] || 'Turn';
        turnEl = mk('div', 'turn-indicator', arrowIn + ' ' + phaseLabel + ' ' + arrowIn);
      }

      const dealMasked = app.dealMaskedSides && app.dealMaskedSides.has(side);

      zone.innerHTML = '';

      // Player name row
      const nameDiv = mk('div', 'player-name');
      nameDiv.appendChild(playerNameEl(p));
      nameDiv.appendChild(document.createTextNode(' '));
      const seatSpan = mk('span', null, 'Seat ' + (Number(seat) + 1));
      seatSpan.style.cssText = 'font-weight:400;color:var(--muted);font-size:12px';
      nameDiv.appendChild(seatSpan);

      // Meta row
      const metaDiv = mk('div', 'player-meta');
      metaDiv.textContent = statusBits.length ? statusBits.join(' · ') : ' ';
      // Tricks-this-hand pill (only relevant once trick play has started)
      let tricksPill = null;
      let tricksCount = 0;
      if (seat !== null && (phase === 'trick_play' || phase === 'score_hand')) {
        const tricks = deriveTricksThisHand();
        tricksCount = Number(tricks[seat] || 0);
        tricksPill = mk('div', 'tricks-pill');
        tricksPill.appendChild(document.createTextNode('Tricks '));
        tricksPill.appendChild(mk('span', 'tn', String(tricksCount)));
      }

      // Hand
      const handDiv = document.createElement('div');
      handDiv.className = 'hand';
      handDiv.id = 'hand-' + side;
      if (dealMasked) handDiv.style.opacity = '0';
      if (isViewer) {
        if (Array.isArray(app.viewerHand) && app.viewerHand.length > 0) {
          for (let i = 0; i < app.viewerHand.length; i++) {
            const code = app.viewerHand[i];
            const isSelected = app.selectedDiscards.indexOf(code) !== -1;
            const extra = [];
            if (canDiscard || canPlay) extra.push('playable');
            if (isSelected) extra.push('selected');
            handDiv.appendChild(cardChipEl(code, trump, extra));
          }
        }
        // Empty viewerHand = all cards played; render nothing (no stray placeholder)
      } else {
        const handCounts = deriveHandCounts();
        // Use 0 for empty/open seats; 5 as fallback only when a player is present
        // but their count isn't tracked yet (e.g. very first render before events load).
        const occupant = seat !== null ? playerBySeat(seat) : null;
        const cardCount = occupant !== null
