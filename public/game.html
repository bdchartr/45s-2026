          ? Math.max(0, handCounts[seat] !== undefined ? handCounts[seat] : 5)
          : 0;
        for (let i = 0; i < cardCount; i++) {
          handDiv.appendChild(mk('div', 'card-chip back'));
        }
      }
      if (side === 'south') {
        // Hand first so it lands on the felt thanks to the negative
        // margin-top; the status strip below mirrors the top info bar.
        zone.appendChild(handDiv);
        const status = mk('div', 'viewer-status');

        const nameChip = mk('div', 'info-pill');
        nameChip.appendChild(playerNameEl(p));
        nameChip.appendChild(document.createTextNode(' · Seat ' + (Number(seat) + 1)));
        status.appendChild(nameChip);

        if (p) {
          const teamChip = mk('div', 'info-pill');
          teamChip.appendChild(mk('span', 'label', 'Team'));
          teamChip.appendChild(document.createTextNode(String(Number(p.team) + 1)));
          status.appendChild(teamChip);
        }

        if (tricksPill) {
          const trickChip = mk('div', 'info-pill');
          trickChip.appendChild(mk('span', 'label', 'Tricks'));
          trickChip.appendChild(document.createTextNode(String(tricksCount)));
          status.appendChild(trickChip);
        }

        if (bidBadgeEl) {
          status.appendChild(bidBadgeEl);
        }

        zone.appendChild(status);
      } else {
        zone.appendChild(nameDiv);
        zone.appendChild(metaDiv);
        if (tricksPill) zone.appendChild(tricksPill);
        zone.appendChild(handDiv);
        if (bidBadgeEl) zone.appendChild(bidBadgeEl);
      }
      if (turnEl) zone.appendChild(turnEl);

      // Attach card click listeners for the viewer's zone
      if (isViewer) {
        const handEl = byId('hand-' + side);
        if (handEl) {
          handEl.addEventListener('click', function (ev) {
            const chip = ev.target.closest('[data-card]');
            if (!chip) return;
            const code = chip.dataset.card;
            if (canPlay) {
              playCard(code);
            } else if (canDiscard) {
              toggleDiscard(code);
            }
          });
        }
      }
    }

    // Returns the cards currently sitting in the middle of the table, keyed
    // by viewer-relative side (north/south/east/west). Only the cards from
    // the in-progress trick — completed tricks have already been swept.
    function deriveTrickTable() {
      const table = { north: null, south: null, east: null, west: null };
      let current = [];

      for (let i = 0; i < app.events.length; i++) {
        const ev = app.events[i];
        if (ev.event_type !== 'card_played') continue;

        current.push({
          seat: Number(ev.actor_seat),
          card: String(ev.payload && ev.payload.card ? ev.payload.card : '?'),
          seq: Number(ev.seq_no),
        });

        if (current.length === 4) {
          current = [];
        }
      }

      for (let j = 0; j < current.length; j++) {
        const item = current[j];
        const side = sideForSeat(item.seat);
        if (side) table[side] = item.card;
      }

      return { table };
    }

    /**
     * Tricks won this hand, indexed by seat. Scoped to events after the
     * latest hand_dealt — counts trick_won/trick_resolved/trick_completed.
     */
    function deriveTricksThisHand() {
      var handDealtSeq = 0;
      for (var i = app.events.length - 1; i >= 0; i--) {
        if (app.events[i].event_type === 'hand_dealt') {
          handDealtSeq = Number(app.events[i].seq_no);
          break;
        }
      }
      var counts = {};
      for (var j = 0; j < app.events.length; j++) {
        var e = app.events[j];
        if (Number(e.seq_no) <= handDealtSeq) continue;
        if (TRICK_WINNER_EVENT_TYPES.indexOf(e.event_type) === -1) continue;
        var ws = e.payload && (e.payload.winner_seat ?? e.payload.winning_seat);
        if (ws == null) continue;
        var seat = Number(ws);
        counts[seat] = (counts[seat] || 0) + 1;
      }
      return counts;
    }

    /**
     * Returns a map of seat → number of cards currently held.
     * Derived from card_played events since the most recent hand_dealt.
     * Falls back to 5 for seats with no data.
     */
    function deriveHandCounts() {
      var handDealtSeq = 0;
      for (var i = app.events.length - 1; i >= 0; i--) {
        if (app.events[i].event_type === 'hand_dealt') {
          handDealtSeq = app.events[i].seq_no;
          break;
        }
      }
      // The discard / dealer-draw-discard cycle is net-zero (each discarded
      // card is replaced from the deck), so we only need to count cards
      // actually played out of the hand. By the time trick play starts,
      // every seat is back at 5.
      var played = {};
      for (var i = 0; i < app.events.length; i++) {
        var e = app.events[i];
        if (e.seq_no <= handDealtSeq) continue;
        if (e.event_type !== 'card_played') continue;
        var s = Number(e.actor_seat);
        played[s] = (played[s] || 0) + 1;
      }
      var counts = {};
      if (Array.isArray(app.players)) {
        app.players.forEach(function(p) {
          var s = Number(p.seat);
          counts[s] = Math.max(0, 5 - (played[s] || 0));
        });
      }
      return counts;
    }

    /**
     * Returns a map of seat → {bid, cls} for all bids in the current hand.
     * cls is 'winning' | 'outbid' | 'pass'.
     */
    function deriveBidStatus() {
      // Find seq_no of the most recent hand_dealt event to scope bids to this hand.
      var handDealtSeq = 0;
      for (var i = app.events.length - 1; i >= 0; i--) {
        if (app.events[i].event_type === 'hand_dealt') {
          handDealtSeq = app.events[i].seq_no;
          break;
        }
      }

      var bids = {}; // seat → bid value (int) or 'pass'
      for (var i = 0; i < app.events.length; i++) {
        var e = app.events[i];
        if (e.seq_no <= handDealtSeq) continue;
        if (e.event_type !== 'bid_action') continue;
        bids[Number(e.actor_seat)] = (e.payload && e.payload.bid !== undefined) ? e.payload.bid : 'pass';
      }

      // Find highest numeric bid
      var highest = 0;
      var highestSeat = null;
      for (var seat in bids) {
        var b = bids[seat];
        if (typeof b === 'number' && b > highest) { highest = b; highestSeat = Number(seat); }
      }

      var result = {};
      for (var seat in bids) {
        var b = bids[seat];
        var s = Number(seat);
        if (b === 'pass') {
          result[s] = { bid: 'Pass', cls: 'pass' };
        } else if (s === highestSeat) {
          result[s] = { bid: String(b), cls: 'winning' };
        } else {
          result[s] = { bid: String(b), cls: 'outbid' };
        }
      }
      return result;
    }

    /**
     * Returns kitty state for the current hand:
     *   { faceDown: true }  — between hand_dealt and trump_declared (3 backs visible to all)
     *   null                — after trump_declared (kitty merged into bid winner's hand, hidden)
     *   null                — before a hand has been dealt
     */
    function deriveKittyCards() {
      var handDealtSeq = 0;
      for (var i = app.events.length - 1; i >= 0; i--) {
        if (app.events[i].event_type === 'hand_dealt') { handDealtSeq = app.events[i].seq_no; break; }
      }
      if (handDealtSeq === 0) return null;
      var trumpDeclared = false;
      for (var i = 0; i < app.events.length; i++) {
        var e = app.events[i];
        if (e.seq_no <= handDealtSeq) continue;
        if (e.event_type === 'trump_declared') { trumpDeclared = true; break; }
      }
      return trumpDeclared ? null : { faceDown: true };
    }

    function viewerHasDiscarded() {
      if (app.viewerSeat === null) return false;
      // Find the latest hand_dealt seq_no so we only check the current hand.
      let handDealtSeq = 0;
      for (let i = 0; i < app.events.length; i++) {
        if (app.events[i].event_type === 'hand_dealt') {
          handDealtSeq = app.events[i].seq_no;
        }
      }
      for (let i = 0; i < app.events.length; i++) {
        const e = app.events[i];
        if (Number(e.seq_no) <= handDealtSeq) continue;
        if ((e.event_type === 'discard_action' || e.event_type === 'dealer_draw_discard')
            && Number(e.actor_seat) === Number(app.viewerSeat)) {
          return true;
        }
      }
      return false;
    }

    function hasEventType(name) {
      for (let i = 0; i < app.events.length; i++) {
        if (String(app.events[i].event_type) === name) return true;
      }
      return false;
    }

    function firstEventType(name) {
      for (let i = 0; i < app.events.length; i++) {
        if (String(app.events[i].event_type) === name) return app.events[i];
      }
      return null;
    }

    function flowRow(label, state, detail) {
      return {
        label: label,
        state: state,
        detail: detail,
      };
    }

    function deriveHandFlow() {
      const g = app.state || {};
      const phase = String(g.current_phase || '');
      const bidActions = app.events.filter(function (e) { return e.event_type === 'bid_action'; }).length;
      const cardPlays = app.events.filter(function (e) { return e.event_type === 'card_played'; }).length;
      const biddingClosed = firstEventType('bidding_closed');
      const forcedDealerBid = firstEventType('forced_dealer_bid');
      const kittyPickedUp = hasEventType('kitty_picked_up');
      const trickWinnerEvents = app.events.filter(function (e) {
        return e.event_type === 'trick_won' || e.event_type === 'trick_resolved' || e.event_type === 'trick_completed';
      }).length;

      const completedTricks = Math.floor(cardPlays / 4);
      const cardsIntoCurrentTrick = cardPlays % 4;
      const activeTrickRound = completedTricks < 5 ? (completedTricks + 1) : null;

      let winnerSeat = null;
      let winningBid = null;
      if (biddingClosed && biddingClosed.payload) {
        winnerSeat = Number.isInteger(biddingClosed.payload.winning_seat) ? biddingClosed.payload.winning_seat : null;
        winningBid = Number.isInteger(biddingClosed.payload.winning_bid) ? biddingClosed.payload.winning_bid : null;
      }

      const rows = [];

      rows.push(flowRow(
        'Deal',
        hasEventType('game_created') ? 'done' : 'active',
        hasEventType('game_created') ? 'Initial deal complete.' : 'Waiting for game_created event.'
      ));

      rows.push(flowRow(
        'Bid Phase',
        phase === 'bidding' ? 'active' : (bidActions > 0 || biddingClosed ? 'done' : 'pending'),
        phase === 'bidding' ? ('In progress: ' + bidActions + '/4 bids') : (bidActions > 0 || biddingClosed ? (bidActions + ' bids recorded') : 'Pending')
      ));

      if (kittyPickedUp) {
        const who = firstEventType('kitty_picked_up');
        const seat = who && who.payload && Number.isInteger(who.payload.winner_seat) ? who.payload.winner_seat : winnerSeat;
        rows.push(flowRow('Bid Winner + Kitty', 'done', 'Seat ' + (seat !== null ? (seat + 1) : '?') + ' received kitty.'));
      } else if (biddingClosed || forcedDealerBid) {
        const winnerText = winnerSeat !== null ? ('Seat ' + (winnerSeat + 1)) : 'Dealer';
        const bidText = winningBid !== null ? (' with bid ' + winningBid) : '';
        rows.push(flowRow('Bid Winner + Kitty', 'active', winnerText + bidText + ' waiting for kitty_picked_up event.'));
      } else if (phase === 'trick_play') {
        rows.push(flowRow('Bid Winner + Kitty', 'active', 'Expected now; waiting for bidding_closed event.'));
      } else {
        rows.push(flowRow('Bid Winner + Kitty', 'pending', 'Pending end of bidding.'));
      }

      const discardDone = hasEventType('discard_completed') || hasEventType('discard_done');
      rows.push(flowRow(
        'Discard',
        discardDone ? 'done' : (phase === 'trick_play' ? 'active' : 'pending'),
        discardDone ? 'Winner discard complete.' : (phase === 'trick_play' ? 'Not yet tracked by server events.' : 'Pending')
      ));

      const restockDone = hasEventType('restock_completed') || hasEventType('restocked_to_five');
      rows.push(flowRow(
        'Restock To 5',
        restockDone ? 'done' : (phase === 'trick_play' ? 'active' : 'pending'),
        restockDone ? 'Hands restocked to five cards.' : (phase === 'trick_play' ? 'Not yet tracked by server events.' : 'Pending')
      ));

      for (let round = 1; round <= 5; round++) {
        if (completedTricks >= round) {
          rows.push(flowRow('Trick Round ' + round, 'done', '4/4 cards complete.'));
          continue;
        }
        if (activeTrickRound === round && phase === 'trick_play') {
          rows.push(flowRow('Trick Round ' + round, 'active', cardsIntoCurrentTrick + '/4 cards played.'));
          continue;
        }
        rows.push(flowRow('Trick Round ' + round, 'pending', 'Not started.'));
      }

      if (trickWinnerEvents < completedTricks) {
        rows.push(flowRow('Trick Winners', 'active', 'Only ' + trickWinnerEvents + ' winner event(s) for ' + completedTricks + ' completed trick(s).'));
      } else if (completedTricks > 0) {
        rows.push(flowRow('Trick Winners', 'done', trickWinnerEvents + ' winner event(s) logged.'));
      }

      return rows;
    }

    function renderHandFlow() {
      const container = byId('handFlow');
      const rows = deriveHandFlow();
      container.innerHTML = '';

      rows.forEach(function (r) {
        const row = mk('div', 'flow-row');
        row.appendChild(mk('div', 'flow-step', r.label));
        row.appendChild(mk('div', 'flow-state ' + r.state, r.detail));
        container.appendChild(row);
      });
    }

    function renderCenter() {
      const center = byId('center');
      const label = byId('centerLabel');
      const derived = deriveTrickTable();
      const trump = app.hand ? app.hand.trump_suit : null;
      const activeAnimation = app.trickAnimation;
      const displayTable = activeAnimation ? activeAnimation.table : derived.table;

      // ── Trick cards — only add/remove when card actually changes ──
      ['north', 'south', 'west', 'east'].forEach(function (side) {
        const card = displayTable[side] || null;
        if (card === app.renderedTrickCards[side]) return; // no change, skip

        const existing = center.querySelector('.card-' + side);
        if (existing) existing.remove();
        app.renderedTrickCards[side] = card;
        if (!card) return;

        const el = document.createElement('div');
        const redCls = isRedSuit(suitOf(card)) ? ' red' : '';
        el.className = 'table-card card-' + side + redCls;
        el.dataset.trickSide = side;
        appendTableCard(el, card);
        center.appendChild(el);
      });

      // ── Kitty display ── only create once; remove only when phase moves past kitty
      const existingKitty = center.querySelector('.kitty-display');
      const kittyState = deriveKittyCards();
      if (kittyState) {
        if (!existingKitty) {
          const kd = mk('div', 'kitty-display');
          kd.appendChild(mk('div', 'kitty-label', 'Kitty'));
          const kittyCards = mk('div', 'kitty-cards');
          for (var ki = 0; ki < 3; ki++) {
            var back = mk('div', 'card-chip back');
            back.style.animationDelay = (ki * 80) + 'ms';
            kittyCards.appendChild(back);
          }
          kd.appendChild(kittyCards);
          center.appendChild(kd);
        }
        label.textContent = '';
      } else {
        if (existingKitty) existingKitty.remove();
        const cardsInMiddle = ['north', 'south', 'west', 'east'].filter(function (s) { return !!displayTable[s]; }).length;
        if (activeAnimation && activeAnimation.winnerSeat !== null) {
          const winName = seatDisplayName(activeAnimation.winnerSeat);
          label.textContent = activeAnimation.phase === 'collecting'
            ? (winName + ' takes the trick')
            : (winName + ' wins!');
        } else if (cardsInMiddle === 0) {
          label.textContent = '';
        } else {
          label.textContent = cardsInMiddle + ' card' + (cardsInMiddle > 1 ? 's' : '') + ' in play';
        }
      }

      // actionHint removed (was debug text)
    }

    function renderLog() {
      const log = byId('eventLog');
      log.innerHTML = '';

      const recent = app.events.slice(-60);
      if (recent.length === 0) {
        log.appendChild(mk('div', 'log-line muted', 'No events yet.'));
        return;
      }

      recent.forEach(function (ev) {
        const line = document.createElement('div');
        line.className = 'log-line';
        line.style.cursor = 'help';
        line.textContent = friendlyEventText(ev);
        line.title = '#' + ev.seq_no + ' ' + ev.event_type + ' seat=' + ev.actor_seat + ' ' + JSON.stringify(ev.payload || {});
        log.appendChild(line);
      });
      log.scrollTop = log.scrollHeight;
    }

    function renderMeta() {
      const g = app.state || {};
      const phaseNames = {
        bidding: 'Bidding', declare_trump: 'Trump', discard_phase: 'Discard', trick_play: 'Trick Play',
      };
      const phase = String(g.current_phase || '');
      const phaseFriendly = phaseNames[phase] || (phase ? phase.replace(/_/g, ' ') : '—');
      const dealerName = g.dealer_seat != null ? seatDisplayName(Number(g.dealer_seat)) : '—';

      byId('gameMeta').textContent =
        'Game #' + app.gameId +
        ' · Hand ' + (g.hand_number ?? '—') +
        ' · Dealer: ' + dealerName +
        ' · Target: ' + (g.target_score ?? '—');

      const me = app.me || {};
      const myName = me.display_name || me.nickname || me.username || (me.user_id ? 'User #' + me.user_id : '—');
      byId('viewerMeta').textContent = Number.isInteger(app.viewerSeat)
        ? myName + ' · Seat ' + (app.viewerSeat + 1)
        : myName;

      byId('phaseMeta').textContent = phaseFriendly;
    }

    function renderControls() {
      renderBoardOverlay();
      renderStatusPanel();
    }

    function renderBoard() {
      ['north', 'south', 'west', 'east'].forEach(renderPlayerZone);
      renderCenter();
      renderMeta();
      renderControls();
      renderInfoBar();
      renderLog();
    }

    function findViewerSeat() {
      if (!app.me || !app.me.user_id) return null;
      for (let i = 0; i < app.players.length; i++) {
        if (Number(app.players[i].user_id) === Number(app.me.user_id)) {
          return Number(app.players[i].seat);
        }
      }
      return null;
    }

    async function refreshAll() {
      if (app.refreshing) { app.needsRefresh = true; return; }
      app.refreshing = true;
      app.needsRefresh = false;
      try {
        const previousMaxSeq = app.maxEventSeq || 0;
        const me = await api('/api/auth/me');
        app.me = me;
        app.csrf = me.csrf_token || '';
        window.APP_CSRF_TOKEN = app.csrf;
        window.APP_USER_ID    = me.user_id || null;

        if (!me.authenticated) {
          const backTo = encodeURIComponent('/45/game.html?game_id=' + app.gameId);
          (function() {
            const statusEl = byId('actionStatus');
            statusEl.innerHTML = '';
            statusEl.appendChild(document.createTextNode('You are not signed in. '));
            const a = document.createElement('a');
            a.href = '/45/lobby.html?next=' + backTo;
            a.textContent = 'Sign in to continue';
            statusEl.appendChild(a);
            statusEl.appendChild(document.createTextNode('.'));
            statusEl.className = 'status error';
          })();
          app.state = {};
          app.players = [];
          app.events = [];
          app.viewerHand = [];
          app.viewerSeat = null;
          renderBoard();
          return;
        }

        const state = await api('/api/game/get_state?game_id=' + encodeURIComponent(app.gameId));
        app.state      = state.game || {};
        app.hand       = state.hand || null;
        app.scores     = state.scores || null;
        app.players    = state.players || [];
        app.events     = state.events || [];
        app.viewerHand = Array.isArray(state.viewer_hand) ? state.viewer_hand : [];
        app.viewerSeat = findViewerSeat();
        syncTrickAnimation(previousMaxSeq);
        syncDealAnimation(previousMaxSeq);
        syncKittyAnimation(previousMaxSeq);
        syncHandResult(previousMaxSeq);
        // Clear discard selection if phase changed away from discard_phase
        if (String(app.state.current_phase) !== 'discard_phase') {
          app.selectedDiscards = [];
        }
        renderBoard();

        if (app.viewerSeat === null) {
          status('You are signed in but not seated in this game.', 'error');
        } else {
          status('');
        }
      } catch (err) {
        status('Refresh failed: ' + err.message, 'error');
      } finally {
        app.refreshing = false;
        if (app.needsRefresh) refreshAll();
      }
    }

    async function submitBid(rawBid) {
      if (app.actionInProgress) return;
      if (!Number.isInteger(app.viewerSeat)) {
        status('Join the game before bidding.', 'error');
        return;
      }
      app.actionInProgress = true;
      renderBoardOverlay();
      try {
        status('Submitting bid...', '');
        const bid = rawBid === 'pass' ? 'pass' : Number(rawBid);
        const res = await api('/api/game/submit_bid', 'POST', {
          game_id: app.gameId,
          seat: app.viewerSeat,
          bid: bid,
        }, true);
        status('Bid accepted: ' + (res.code || 'ok'), 'success');
        await refreshAll();
      } catch (err) {
        status('Bid failed: ' + err.message, 'error');
      } finally {
        app.actionInProgress = false;
      }
    }

    // -------------------------------------------------------------------------
    // Deal animation
    // -------------------------------------------------------------------------

    function runDealAnimation(dealerSeat, playerCount) {
      if (!Number.isInteger(app.viewerSeat)) return;

      const dealerSide = sideForSeat(dealerSeat);
      if (!dealerSide) return;
      const dealerZone = document.getElementById('zone-' + dealerSide);
      if (!dealerZone) return;

      // Seat order starting left-of-dealer, going clockwise
      const allSides = ['south', 'west', 'north', 'east'];
      const dealerIdx = allSides.indexOf(dealerSide);
      const orderedSides = [];
      for (let i = 1; i <= 4; i++) {
        orderedSides.push(allSides[(dealerIdx + i) % 4]);
      }

      // 3-around, 2-around, 3-to-kitty
      const sequence = [];
      for (let p = 0; p < 3; p++) {
        for (const side of orderedSides) sequence.push({ dest: side });
      }
      for (let p = 3; p < 5; p++) {
        for (const side of orderedSides) sequence.push({ dest: side });
      }
      for (let k = 0; k < 3; k++) {
        sequence.push({ dest: 'kitty' });
      }

      // Mask all player hands NOW (synchronously) so renderBoard() hides them
      app.dealMaskedSides = new Set(orderedSides);

      // Find the last delivery step index for each player side
      const lastStepBySide = {};
      sequence.forEach(function(step, i) {
        if (step.dest !== 'kitty') lastStepBySide[step.dest] = i;
      });

      const DEAL_STEP_MS = 333;

      sequence.forEach(function (step, i) {
        setTimeout(function () {
          const targetEl = step.dest === 'kitty'
            ? document.getElementById('center')
            : document.getElementById('zone-' + step.dest);
          if (!targetEl) return;

          const dealerRect = dealerZone.getBoundingClientRect();
          const targetRect = targetEl.getBoundingClientRect();

          const fw = 42, fh = 60;
          const startX = dealerRect.left + dealerRect.width / 2 - fw / 2;
          const startY = dealerRect.top + dealerRect.height / 2 - fh / 2;
          const endX = targetRect.left + targetRect.width / 2 - fw / 2;
          const endY = targetRect.top + targetRect.height / 2 - fh / 2;
          const dx = endX - startX;
          const dy = endY - startY;
          const rotStart = (Math.random() * 8 - 4).toFixed(1);
          const rotEnd = (Math.random() * 6 - 3).toFixed(1);

          const fly = document.createElement('div');
          fly.className = 'fly-deal-card';
          fly.style.left = startX + 'px';
          fly.style.top = startY + 'px';
          fly.style.transform = 'rotate(' + rotStart + 'deg) scale(0.88)';
          fly.style.opacity = '0';
          document.body.appendChild(fly);

          void fly.offsetWidth;
          fly.style.transition = 'transform 0.30s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.15s ease';
          fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rotEnd + 'deg) scale(1)';
          fly.style.opacity = '1';

          setTimeout(function () {
            fly.style.opacity = '0';
            setTimeout(function () {
              if (fly.parentNode) fly.parentNode.removeChild(fly);
            }, 160);
          }, 260);
        }, i * DEAL_STEP_MS);
      });

      // Reveal each player's hand after their last card lands
      Object.keys(lastStepBySide).forEach(function(side) {
        const revealAt = lastStepBySide[side] * DEAL_STEP_MS + 500;
        setTimeout(function() {
          if (app.dealMaskedSides) app.dealMaskedSides.delete(side);
          const handEl = document.getElementById('hand-' + side);
          if (handEl) {
            handEl.style.transition = 'opacity 0.38s ease';
            handEl.style.opacity = '1';
          }
        }, revealAt);
      });

      // Safety: clear mask after full animation + buffer
      const totalMs = (sequence.length - 1) * DEAL_STEP_MS + 1200;
      setTimeout(function() { app.dealMaskedSides = null; }, totalMs);
    }

    function syncDealAnimation(previousMaxSeq) {
      if (previousMaxSeq === 0) return; // skip on first load
      let latestDeal = null;
      for (let i = app.events.length - 1; i >= 0; i--) {
        if (app.events[i].event_type === 'hand_dealt') {
          latestDeal = app.events[i];
          break;
        }
      }
      if (!latestDeal) return;
      const dealSeq = Number(latestDeal.seq_no);
      if (dealSeq > previousMaxSeq && dealSeq !== app.lastDealSeq) {
        app.lastDealSeq = dealSeq;
        const p = latestDeal.payload || {};
        const dealerSeat = Number(p.dealer_seat ?? app.state.dealer_seat ?? 0);
        const playerCount = Number(p.player_count || 4);
        runDealAnimation(dealerSeat, playerCount);
      }
    }

    // -------------------------------------------------------------------------
    // Kitty pick-up animation
    // -------------------------------------------------------------------------

    function runKittyAnimation(winnerSeat) {
      const winnerSide = sideForSeat(winnerSeat);
      if (!winnerSide) return;
      const center = document.getElementById('center');
      const targetZone = document.getElementById('zone-' + winnerSide);
      if (!center || !targetZone) return;

      // Read rects synchronously before renderBoard removes the kitty-display
      const centerRect  = center.getBoundingClientRect();
      const targetRect  = targetZone.getBoundingClientRect();

      const STAGGER_MS = 160;
      const fw = 42, fh = 60;

      for (let k = 0; k < 3; k++) {
        setTimeout(function () {
          // Spread start positions slightly around center
          const startX = centerRect.left + centerRect.width  / 2 - fw / 2 + (k - 1) * 16;
          const startY = centerRect.top  + centerRect.height / 2 - fh / 2 + (k - 1) *  8;
          const endX   = targetRect.left + targetRect.width  / 2 - fw / 2 + (Math.random() * 20 - 10);
          const endY   = targetRect.top  + targetRect.height / 2 - fh / 2 + (Math.random() * 12 -  6);
          const dx = endX - startX;
          const dy = endY - startY;
          const rotStart = ((k - 1) * 10).toFixed(1);
          const rotEnd   = (Math.random() * 12 - 6).toFixed(1);

          const fly = document.createElement('div');
          fly.className = 'fly-deal-card';
          fly.style.left      = startX + 'px';
          fly.style.top       = startY + 'px';
          fly.style.transform = 'rotate(' + rotStart + 'deg) scale(0.88)';
          fly.style.opacity   = '0';
          document.body.appendChild(fly);

          void fly.offsetWidth;
          fly.style.transition = 'transform 0.38s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.16s ease';
          fly.style.transform  = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rotEnd + 'deg) scale(1)';
          fly.style.opacity    = '1';

          setTimeout(function () {
            fly.style.opacity = '0';
            setTimeout(function () { if (fly.parentNode) fly.parentNode.removeChild(fly); }, 180);
          }, 310);
        }, k * STAGGER_MS);
      }
    }

    function syncKittyAnimation(previousMaxSeq) {
      if (previousMaxSeq === 0) return;
      for (let i = app.events.length - 1; i >= 0; i--) {
        const ev = app.events[i];
        if (ev.event_type === 'kitty_picked_up' && Number(ev.seq_no) > previousMaxSeq) {
          const p = ev.payload || {};
          const winnerSeat = Number(p.winner_seat ?? -1);
          if (winnerSeat >= 0) runKittyAnimation(winnerSeat);
          break;
        }
      }
    }

    // Animates a card from the player's hand onto the table.
    // Returns { el, settled } where `el` is the live DOM node (so the caller
    // can clean it up if the play is rejected even before the animation
    // settles) and `settled` is a Promise that resolves to the same node
    // once the arc finishes.
    function flyCardToCenter(code, trump, fromRect, side) {
      const center = byId('center');
      if (!center || !fromRect) return { el: null, settled: Promise.resolve(null) };

      const centerRect = center.getBoundingClientRect();
      const metrics = getTableCardMetrics();
      const cw = metrics.width;
      const ch = metrics.height;

      // Compute target viewport position matching the .card-{side} CSS rules
      var targetLeft, targetTop;
      if (side === 'north') {
        targetLeft = centerRect.left + centerRect.width / 2 - cw / 2;
        targetTop  = centerRect.top + 12;
      } else if (side === 'south') {
        targetLeft = centerRect.left + centerRect.width / 2 - cw / 2;
        targetTop  = centerRect.bottom - 12 - ch;
      } else if (side === 'west') {
        targetLeft = centerRect.left + 12;
        targetTop  = centerRect.top + centerRect.height / 2 - ch / 2;
      } else {
        targetLeft = centerRect.right - 12 - cw;
        targetTop  = centerRect.top + centerRect.height / 2 - ch / 2;
      }

      // Start at the hand chip's centre, sized as a table card
      var startLeft = fromRect.left + (fromRect.width  - cw) / 2;
      var startTop  = fromRect.top  + (fromRect.height - ch) / 2;
      var dx = targetLeft - startLeft;
      var dy = targetTop  - startTop;

      var fly = document.createElement('div');
      fly.className = 'table-card fly-card' + (isRedSuit(suitOf(code)) ? ' red' : '');
      appendTableCard(fly, code);
      fly.style.cssText =
        'left:' + startLeft + 'px;' +
        'top:'  + startTop  + 'px;' +
        'width:' + cw + 'px;' +
        'height:' + ch + 'px;' +
        'transform:scale(0.72) rotate(-3deg);';
      document.body.appendChild(fly);

      // Trump cards get a brief gold-rim lift before arcing to the felt
      var isTrump = trump && suitOf(code) === trump;
      if (isTrump) {
        fly.style.boxShadow = '0 0 0 2px var(--gold), 0 8px 18px rgba(0,0,0,.45)';
      }

      // Force reflow then start transition (450ms easeOutCubic)
      void fly.offsetWidth;
      fly.style.transition =
        'transform 0.45s cubic-bezier(0.33,1,0.68,1),' +
        'opacity   0.45s ease,' +
        'box-shadow 0.3s ease';
      fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1) rotate(2deg)';
      if (isTrump) {
        // Fade gold rim as card settles
        setTimeout(function() { fly.style.boxShadow = ''; }, 200);
      }

      // Resolve with the fly element; caller removes it after renderBoard runs
      const settled = new Promise(function (resolve) {
        setTimeout(function () { resolve(fly); }, 450);
      });
      return { el: fly, settled: settled };
    }

    async function playCard(code) {
      if (app.actionInProgress) return;
      if (!Number.isInteger(app.viewerSeat)) {
        status('Join the game before playing.', 'error');
        return;
      }
      if (!code) return;
      app.actionInProgress = true;

      // Capture hand chip position before removing it
      const chipEl = document.querySelector('[data-card="' + code + '"]');
      const fromRect = chipEl ? chipEl.getBoundingClientRect() : null;
      const trump    = app.hand ? app.hand.trump_suit : null;

      // Remove card from local hand immediately for instant feedback
      app.viewerHand = app.viewerHand.filter(function (c) { return c !== code; });
      renderPlayerZone('south');

      status('Playing ' + cardLabel(code) + '…', '');

      // Start the fly animation. We grab the live DOM node synchronously so
      // we can always remove it on failure — even if the API rejects before
      // the 450ms arc lands.
      const fly = flyCardToCenter(code, trump, fromRect, 'south');
      const flyEl = fly.el;

      try {
        await Promise.all([
          fly.settled,
          api('/api/game/play_card', 'POST', {
            game_id: app.gameId,
            seat: app.viewerSeat,
            card: code,
          }, true),
        ]);

        // Refresh renders the real table card underneath the still-visible fly card
        await refreshAll();

        // Fade out fly card now that the real card is in the DOM
        if (flyEl && flyEl.parentNode) {
          flyEl.style.transition = 'opacity 0.12s ease';
          flyEl.style.opacity = '0';
          setTimeout(function () { if (flyEl && flyEl.parentNode) flyEl.parentNode.removeChild(flyEl); }, 130);
        }

        status('Played ' + cardLabel(code), 'success');
      } catch (err) {
        // Failure path: the rejected card must NOT linger on the felt.
        // Remove the fly element regardless of whether its arc finished.
        if (flyEl && flyEl.parentNode) flyEl.parentNode.removeChild(flyEl);
        // Restore card to the hand
        if (!app.viewerHand.includes(code)) {
          app.viewerHand.push(code);
          renderPlayerZone('south');
        }
        status(err.message || 'Play failed.', 'error');
      } finally {
        app.actionInProgress = false;
      }
    }

    function toggleDiscard(code) {
      const idx = app.selectedDiscards.indexOf(code);
      if (idx === -1) {
        app.selectedDiscards.push(code);
      } else {
        app.selectedDiscards.splice(idx, 1);
      }
      // Re-render just the viewer zone and controls (fast, no server round-trip)
      const viewerSide = app.viewerSeat !== null
        ? ['south', 'west', 'north', 'east'][(0 + 4) % 4]  // viewer is always south
        : null;
      renderPlayerZone('south');
      renderControls();
    }

    async function discardCards() {
      if (app.actionInProgress) return;
      if (!Number.isInteger(app.viewerSeat)) {
        status('Not seated.', 'error');
        return;
      }
      app.actionInProgress = true;
      renderBoardOverlay();
      try {
        const cards = app.selectedDiscards.slice();
        status('Discarding ' + cards.length + ' card(s)…', '');
        await api('/api/game/discard_cards', 'POST', {
          game_id: app.gameId,
          seat: app.viewerSeat,
          cards: cards,
        }, true);
        app.selectedDiscards = [];
        status('Discard submitted.', 'success');
        await refreshAll();
      } catch (err) {
        status('Discard failed: ' + err.message, 'error');
      } finally {
        app.actionInProgress = false;
      }
    }

    async function declareTrump(trump) {
      if (app.actionInProgress) return;
      if (!Number.isInteger(app.viewerSeat)) return;
      app.actionInProgress = true;
      renderBoardOverlay();
      try {
        status('Declaring ' + SUIT_NAME[trump] + '…', '');
        await api('/api/game/declare_trump', 'POST', {
          game_id: app.gameId,
          seat: app.viewerSeat,
          trump: trump,
        }, true);
        status(SUIT_NAME[trump] + ' is trump.', 'success');
        await refreshAll();
      } catch (err) {
        status('Trump failed: ' + err.message, 'error');
      } finally {
        app.actionInProgress = false;
      }
    }

    function bindEvents() {
      byId('refreshBtn').addEventListener('click', refreshAll);
    }

    function parseGameId() {
      const q = new URLSearchParams(window.location.search);
      const id = Number(q.get('game_id') || '0');
      return Number.isInteger(id) && id > 0 ? id : 0;
    }

    async function boot() {
      app.gameId = parseGameId();
      if (app.gameId <= 0) {
        status('Missing or invalid game_id in query string.', 'error');
        byId('gameMeta').textContent = 'Open this page with ?game_id=123';
        return;
      }

      bindEvents();
      await refreshAll();

      app.pollingId = window.setInterval(function () {
        refreshAll();
      }, 2000);
    }

    boot();
  </script>
</body>
</html>
